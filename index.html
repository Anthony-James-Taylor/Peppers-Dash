<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepper's Doo-Doo Dash V41 (Refactored)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00fbff; --danger: #ff7675; --ui-bg: rgba(0,0,0,0.85); }
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Montserrat', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
        
        /* UI LAYOUTS */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
        .screen.active { pointer-events: auto; opacity: 1; }
        .screen-bg { background: var(--ui-bg); backdrop-filter: blur(10px); }
        
        /* HUD */
        #ui-hud { justify-content: flex-start; align-items: center; z-index: 5; pointer-events: none; display: none; }
        .hud-top { display: flex; justify-content: space-between; width: 90%; margin-top: 20px; }
        .pill { background: rgba(0,0,0,0.8); border: 2px solid rgba(255,255,255,0.3); border-radius: 16px; padding: 8px 20px; color: white; display: flex; flex-direction: column; align-items: center; }
        #score-val { font-size: 24px; font-weight: 900; }
        #level-lbl { color: var(--primary); font-size: 10px; font-weight: 900; }
        #stick-count { font-size: 20px; font-weight: 900; }

        /* PROGRESS BAR */
        #progress-container { position: absolute; top: 100px; width: 60%; height: 8px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; }
        #progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.1s linear; border-radius: 4px; }
        #finish-flag { position: absolute; right: -20px; top: -25px; font-size: 30px; }

        /* MEGA METER */
        #mega-container { position: absolute; bottom: 30px; background: rgba(0,0,0,0.9); border: 2px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 10px 30px; display: flex; flex-direction: column; align-items: center; transition: transform 0.2s; }
        #mega-container.active { box-shadow: 0 0 20px #ff00ff; border-color: #ff00ff; animation: pulse 0.5s infinite; }
        #mega-bar { width: 200px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin: 5px 0; }
        #mega-fill { height: 100%; width: 0%; background: #ff00ff; transition: width 0.2s; }
        #mega-lbl { color: white; font-weight: 900; font-size: 14px; }

        /* BUTTONS & TEXT */
        h1 { color: white; font-size: 50px; text-align: center; line-height: 0.9; margin-bottom: 40px; text-transform: uppercase; text-shadow: 0 4px 0 #000; }
        .btn { background: white; color: #2d3436; padding: 15px 40px; border-radius: 30px; font-size: 20px; font-weight: 900; border: none; cursor: pointer; margin-top: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); background: #dfe6e9; }
        .btn-small { padding: 10px 20px; font-size: 12px; background: rgba(255,255,255,0.1); color: white; border: 1px solid white; }

        /* SHOP */
        #shop-screen { background: linear-gradient(135deg, #74b9ff, #0984e3); justify-content: flex-start; overflow-y: auto; padding-top: 20px; }
        #shop-header { width: 90%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 90%; max-width: 800px; padding-bottom: 100px; }
        .shop-card { background: white; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; border: 4px solid #b2bec3; cursor: pointer; position: relative; }
        .shop-card.owned { border-color: #00b894; background: #edfffa; }
        .shop-card.equipped { border-color: #0984e3; transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .shop-card.locked { opacity: 0.7; background: #dfe6e9; }
        .card-btn { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; border: none; font-weight: 900; cursor: pointer; font-size: 10px; }
        .btn-buy { background: #d63031; color: white; }
        .btn-equip { background: #00b894; color: white; }
        .btn-equipped { background: #0984e3; color: white; }
        
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 100; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <canvas id="cvs"></canvas>
    <div id="flash"></div>

    <div id="ui-hud" class="screen" style="display:flex;">
        <div class="hud-top">
            <div class="pill">
                <span id="level-lbl">LEVEL 1</span>
                <span id="score-val">0 🦴</span>
            </div>
            <div class="pill">
                <div style="font-size:10px;">SHIELD</div>
                <span id="stick-count">0/5</span>
            </div>
        </div>
        <div id="progress-wrapper"><div id="progress-container"><div id="progress-fill"></div><div id="finish-flag">🏁</div></div></div>
        <div id="mega-container">
            <div id="mega-lbl">MEGA MODE</div>
            <div id="mega-bar"><div id="mega-fill"></div></div>
            <div id="mega-status" style="color:white; font-size:10px;">COLLECT 50</div>
        </div>
    </div>

    <div id="screen-start" class="screen active">
        <h1>Pepper's<br>Doo-Doo Dash<br><span style="font-size:20px; color:var(--primary)">Refactored</span></h1>
        <button class="btn" onclick="Game.setDifficulty('normal'); Game.startSequence()">PLAY NORMAL</button>
        <button class="btn btn-small" onclick="Game.setDifficulty('baby'); Game.startSequence()">BABY MODE</button>
        <button class="btn btn-small" style="color:#ff7675; border-color:#ff7675" onclick="Game.setDifficulty('death'); Game.startSequence()">DEATH MODE</button>
    </div>

    <div id="shop-screen" class="screen">
        <div id="shop-header">
            <div style="background:white; padding:10px; border-radius:10px; font-weight:bold;" id="shop-msg">WELCOME!</div>
            <div class="pill" style="border:2px solid white; background:#2d3436;"><span id="shop-bones" style="color:#f1c40f">0 🦴</span></div>
        </div>
        <div id="shop-grid"></div>
        <div style="position:fixed; bottom:20px; width:100%; display:flex; justify-content:center;">
            <button class="btn" style="background:#2d3436; color:white;" onclick="Game.nextLevel()">NEXT LEVEL ▶</button>
        </div>
    </div>

    <div id="screen-gameover" class="screen screen-bg">
        <h1 style="color:var(--danger)">GAME OVER</h1>
        <div id="death-msg" style="color:white; margin-bottom:20px;"></div>
        <div style="font-size:30px; color:white; font-weight:900; margin-bottom:20px;" id="final-score">0</div>
        <button class="btn" onclick="Game.retry()">TRY AGAIN</button>
        <button class="btn btn-small" onclick="Game.home()">HOME</button>
    </div>

<script>
/**
 * PEPPER'S DOO-DOO DASH V41 - REFACTORED
 * Organized into modules: Config, Audio, Render, Entities, GameState
 */

// --- CONFIGURATION ---
const CONFIG = {
    gravity: 1.1,
    groundHeight: 140,
    baseSpeed: 10.5,
    colors: {
        skyDay: ['#81ecec', '#74b9ff'],
        skyDusk: ['#ff9f43', '#ee5253'],
        skyNight: ['#2c3e50', '#000000'],
        grass: '#00b894',
        ground: '#5D4037'
    },
    hats: {
        none: { id: 'none', name: 'None', cost: 0, perk: 'None' },
        cap: { id: 'cap', name: 'Red Cap', cost: 50, perk: '2x Bones' },
        tophat: { id: 'tophat', name: 'Top Hat', cost: 100, perk: 'Start w/ Shield' },
        cowboy: { id: 'cowboy', name: 'Cowboy', cost: 200, perk: 'Fast Mega' },
        space: { id: 'space', name: 'Space Helm', cost: 300, perk: 'Moon Jump' }
    }
};

// --- AUDIO SYSTEM ---
const AudioSystem = {
    ctx: null,
    isMuted: false,
    interval: null,
    
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },

    playTone(freq, type, duration, vol=0.1) {
        if (this.isMuted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration + 0.1);
    },

    sfx(name) {
        if (this.isMuted) return;
        switch(name) {
            case 'jump': this.playTone(350, 'triangle', 0.1); break;
            case 'doublejump': this.playTone(600, 'square', 0.1); break;
            case 'collect': this.playTone(1400, 'sine', 0.2, 0.2); break;
            case 'smash': this.playTone(80, 'sawtooth', 0.3); break;
            case 'crash': this.playTone(50, 'sawtooth', 0.5); break;
            case 'hiss': this.playTone(800, 'sawtooth', 0.2); break; // Cat
        }
    },

    startMusic(tempo = 120) {
        if (this.interval || this.isMuted) return;
        let step = 0;
        const bass = [82,0,82,98,0,82,110,0,82,0,123,110,98,82,0,146];
        this.interval = setInterval(() => {
            if (Game.state !== 'playing') return;
            const note = bass[step % 16];
            if (note) this.playTone(note, 'sawtooth', 0.2, 0.1);
            if (step % 8 === 4) this.playTone(100, 'white', 0.05); // Snare
            step++;
        }, 60000 / (tempo * 4));
    },

    stopMusic() {
        clearInterval(this.interval);
        this.interval = null;
    }
};

// --- RENDERER (Pure Drawing Functions) ---
const Draw = {
    clear(ctx, w, h) { ctx.clearRect(0, 0, w, h); },
    
    rect(ctx, x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); },
    
    circle(ctx, x, y, r, color) { 
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill(); 
    },

    sky(ctx, w, h, level, progress) {
        // Simple interpolation between sky colors based on progress
        const set = CONFIG.colors.skyDay; // Simplified for brevity, logic can expand
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, set[0]); grad.addColorStop(1, set[1]);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
    },

    ground(ctx, w, h, groundY, speed, frame) {
        ctx.fillStyle = CONFIG.colors.ground;
        ctx.fillRect(0, groundY, w, h - groundY);
        ctx.fillStyle = CONFIG.colors.grass;
        ctx.fillRect(0, groundY, w, 20);
        
        // Striping effect
        ctx.fillStyle = "rgba(255,255,255,0.1)";
        const offset = (frame * speed) % 100;
        for (let i = -100; i < w + 100; i += 100) {
            ctx.beginPath();
            ctx.moveTo(i - offset, groundY);
            ctx.lineTo(i - offset + 40, h);
            ctx.lineTo(i - offset + 80, h);
            ctx.lineTo(i - offset + 40, groundY);
            ctx.fill();
        }
    },

    husky(ctx, x, y, frame, isMega, hasShield, hat) {
        ctx.save();
        ctx.translate(x, y);
        const scale = isMega ? 1.5 : 1;
        ctx.scale(scale, scale);

        // Bobbing animation
        const bob = Math.sin(frame * 0.3) * 2;
        ctx.translate(0, bob);

        // Body color
        const fur = isMega ? `hsl(${(frame*10)%360}, 70%, 50%)` : '#1a1a1a';
        
        // Body
        ctx.fillStyle = fur;
        ctx.beginPath(); ctx.ellipse(0, 30, 20, 15, 0, 0, Math.PI*2); ctx.fill(); // Torso
        
        // Head
        ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill(); // Head circle
        
        // Face Markings
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(0, 5, 18, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = fur;
        ctx.beginPath(); ctx.moveTo(-15,-10); ctx.lineTo(-20,-30); ctx.lineTo(0,-10); ctx.lineTo(20,-30); ctx.lineTo(15,-10); ctx.fill(); // Ears/Mask

        // Eyes
        ctx.fillStyle = (Game.difficulty === 'death') ? 'red' : '#00fbff';
        ctx.beginPath(); ctx.arc(-8, -2, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -2, 4, 0, Math.PI*2); ctx.fill();

        // Hat Rendering
        if (hat !== 'none') this.hat(ctx, hat);

        // Shield
        if (hasShield) {
            ctx.strokeStyle = '#00b894';
            ctx.lineWidth = 3;
            const shieldRot = frame * 0.1;
            ctx.beginPath();
            for(let i=0; i<3; i++) {
                const ang = shieldRot + (i * Math.PI * 2 / 3);
                const sx = Math.cos(ang) * 40;
                const sy = Math.sin(ang) * 40;
                ctx.moveTo(sx-5, sy); ctx.lineTo(sx+5, sy);
            }
            ctx.stroke();
        }

        ctx.restore();
    },

    hat(ctx, type) {
        ctx.save();
        if (type === 'cap') {
            ctx.fillStyle = '#d63031';
            ctx.beginPath(); ctx.arc(0, -20, 12, Math.PI, 0); ctx.fill();
            ctx.fillRect(5, -20, 15, 4); // Bill
        } else if (type === 'tophat') {
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(-12, -45, 24, 25);
            ctx.fillRect(-16, -20, 32, 5);
            ctx.fillStyle = 'red'; ctx.fillRect(-12, -25, 24, 4);
        } else if (type === 'cowboy') {
            ctx.fillStyle = '#8B4513';
            ctx.translate(0, -25);
            ctx.beginPath(); ctx.ellipse(0, 0, 25, 5, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillRect(-12, -15, 24, 15);
        } else if (type === 'space') {
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
            ctx.fillStyle = 'rgba(100,200,255,0.4)';
            ctx.beginPath(); ctx.arc(0, -5, 35, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
    },

    // Simple drawing for obstacles
    obstacle(ctx, o) {
        ctx.save();
        ctx.translate(o.x, o.y);
        
        if (o.type === 'poo') {
            ctx.fillStyle = '#8B4513';
            ctx.beginPath(); ctx.ellipse(0, 0, 15, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(0, -10, 10, 8, 0, 0, Math.PI*2); ctx.fill();
        } else if (o.type === 'hydrant') {
            ctx.fillStyle = '#d63031';
            ctx.fillRect(-10, -30, 20, 30);
            ctx.beginPath(); ctx.arc(0, -30, 10, Math.PI, 0); ctx.fill();
        } else if (o.type === 'vacuum') {
            ctx.fillStyle = '#636e72'; ctx.fillRect(-15, -10, 30, 10);
            ctx.fillStyle = '#d63031'; ctx.fillRect(-10, -50, 20, 40);
        } else if (o.type === 'bird') {
            ctx.fillStyle = '#2d3436';
            ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
            const flap = Math.sin(Date.now()/50)*10;
            ctx.fillStyle = '#b2bec3';
            ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(20, -10+flap); ctx.lineTo(10,5); ctx.fill();
        } else if (o.type === 'cat') {
            ctx.fillStyle = '#a4b0be';
            ctx.beginPath(); ctx.arc(0, -10, 15, Math.PI, 0); ctx.fill(); // Body
            ctx.beginPath(); ctx.arc(-10, -20, 10, 0, Math.PI*2); ctx.fill(); // Head
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-12, -22, 3, 0, Math.PI*2); ctx.fill(); // Eye
        }
        ctx.restore();
    },

    pickup(ctx, p) {
        ctx.save();
        ctx.translate(p.x, p.y + Math.sin(Date.now()/200)*5);
        if (p.type === 'stick') {
            ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(-10, 5); ctx.lineTo(10, -5); ctx.stroke();
            ctx.fillStyle = '#00b894'; ctx.beginPath(); ctx.arc(10, -5, 3, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = p.type === 'gold' ? '#f1c40f' : 'white';
            ctx.fillRect(-10, -3, 20, 6);
            ctx.beginPath(); ctx.arc(-10, 0, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, 0, 5, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }
};

// --- ENTITIES ---

class Player {
    constructor() {
        this.reset();
    }

    reset() {
        this.y = 0;
        this.dy = 0;
        this.grounded = true;
        this.canDouble = false;
        this.shield = false;
        this.sticks = 0;
        this.megaTimer = 0;
        this.streak = 0;
        
        // Hat Effects
        this.hat = Game.shop.equipped;
        this.gravity = (this.hat === 'space') ? 0.6 : CONFIG.gravity;
        this.jumpForce = (this.hat === 'space') ? -13 : -18;
        
        if (this.hat === 'tophat') { this.sticks = 5; this.shield = true; }
        if (this.hat === 'space') this.shield = true; // Space helm acts as shield once
    }

    jump() {
        if (this.grounded) {
            this.dy = this.jumpForce;
            this.grounded = false;
            this.canDouble = true;
            AudioSystem.sfx('jump');
        } else if (this.canDouble) {
            this.dy = this.jumpForce * 0.8;
            this.canDouble = false;
            AudioSystem.sfx('doublejump');
        }
    }

    update() {
        // Mega Logic
        if (this.megaTimer > 0) {
            this.megaTimer--;
            if (this.megaTimer <= 0) {
                this.streak = 0;
                Game.ui.updateMega(0);
            }
        }

        // Physics
        this.dy += this.gravity;
        this.y += this.dy;

        const floor = Game.groundY;
        if (this.y >= floor) {
            this.y = floor;
            this.dy = 0;
            this.grounded = true;
        }
    }

    collectStick() {
        if (Game.difficulty === 'death') return;
        this.sticks++;
        if (this.sticks >= 5) {
            this.sticks = 0;
            this.shield = true;
            Game.ui.flash('#00b894');
        }
        Game.ui.updateSticks(this.sticks);
    }

    hit() {
        if (this.megaTimer > 0) return false; // Invincible
        
        if (this.shield) {
            this.shield = false;
            this.sticks = 0;
            Game.ui.updateSticks(0);
            Game.ui.flash('#ff7675');
            AudioSystem.sfx('crash');
            return false; // Survived
        }
        return true; // Ded
    }
}

class Spawner {
    constructor() {
        this.timer = 0;
        this.boneTimer = 0;
    }

    update() {
        // Obstacles
        if (this.timer-- <= 0) {
            this.spawnObstacle();
            // Faster spawns based on level
            this.timer = Math.max(30, 90 - (Game.level * 5));
        }

        // Pickups
        if (this.boneTimer-- <= 0) {
            const y = Game.groundY - (Math.random() > 0.5 ? 120 : 40);
            const type = Math.random() > 0.9 ? 'gold' : 'white';
            Game.pickups.push({ x: Game.cvs.width, y, type, w: 20, h: 20 });
            
            // Stick
            if (Math.random() > 0.7) {
                 Game.pickups.push({ x: Game.cvs.width + 50, y: Game.groundY - 100, type: 'stick', w: 20, h: 40 });
            }
            this.boneTimer = 40;
        }
    }

    spawnObstacle() {
        const typeRoll = Math.random();
        let type = 'poo';
        let y = Game.groundY;
        let speedMod = 1;

        if (Game.level >= 2 && typeRoll > 0.7) { type = 'cat'; speedMod = 0; } // Stationary hazard
        else if (Game.level >= 3 && typeRoll > 0.85) { type = 'vacuum'; speedMod = 1.2; }
        else if (typeRoll > 0.6) { type = 'hydrant'; }
        else if (typeRoll > 0.9) { type = 'bird'; y = Game.groundY - 90; }

        Game.obstacles.push({
            x: Game.cvs.width,
            y: y,
            type: type,
            speedMod: speedMod,
            w: 30, h: 30 // Rough hitboxes
        });
    }
}

// --- MAIN GAME CONTROLLER ---
const Game = {
    cvs: document.getElementById('cvs'),
    ctx: document.getElementById('cvs').getContext('2d'),
    state: 'start', // start, playing, shop, gameover
    width: 0, height: 0, groundY: 0,
    
    player: new Player(),
    spawner: new Spawner(),
    
    obstacles: [],
    pickups: [],
    
    score: 0,
    level: 1,
    levelDist: 0,
    difficulty: 'normal',
    
    shop: {
        inventory: ['none'],
        equipped: 'none'
    },

    ui: {
        screens: document.querySelectorAll('.screen'),
        updateScore: (s) => document.getElementById('score-val').innerText = s + ' 🦴',
        updateLevel: (l) => document.getElementById('level-lbl').innerText = 'LEVEL ' + l,
        updateSticks: (s) => document.getElementById('stick-count').innerText = s + '/5',
        updateMega: (v) => document.getElementById('mega-fill').style.width = v + '%',
        updateProgress: (p) => document.getElementById('progress-fill').style.width = p + '%',
        
        showScreen(id) {
            this.screens.forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            // Toggle HUD visibility
            document.getElementById('ui-hud').style.display = (id === 'shop-screen' || id === 'screen-start' || id === 'screen-gameover') ? 'none' : 'flex';
        },
        
        flash(color) {
            const f = document.getElementById('flash');
            f.style.background = color;
            f.style.opacity = 0.6;
            setTimeout(() => f.style.opacity = 0, 100);
        }
    },

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Input
        const inputAction = (e) => {
            if (this.state === 'playing') {
                e.preventDefault();
                this.player.jump();
            }
        };
        window.addEventListener('mousedown', inputAction);
        window.addEventListener('touchstart', inputAction, {passive:false});

        // Loop
        this.lastTime = 0;
        requestAnimationFrame(t => this.loop(t));
        
        this.renderShop();
    },

    resize() {
        this.cvs.width = window.innerWidth;
        this.cvs.height = window.innerHeight;
        this.width = this.cvs.width;
        this.height = this.cvs.height;
        this.groundY = this.height - CONFIG.groundHeight;
    },

    setDifficulty(d) {
        this.difficulty = d;
    },

    startSequence() {
        this.score = 0;
        this.level = 1;
        this.startLevel();
    },

    startLevel() {
        this.player.reset();
        this.obstacles = [];
        this.pickups = [];
        this.levelDist = 0;
        this.spawner = new Spawner();
        
        this.ui.updateScore(this.score);
        this.ui.updateLevel(this.level);
        this.ui.updateSticks(this.player.sticks);
        this.ui.updateMega(0);
        this.ui.showScreen('ui-hud'); // Hide overlays, show HUD
        
        AudioSystem.init();
        AudioSystem.startMusic();
        
        this.state = 'playing';
    },

    nextLevel() {
        this.level++;
        this.startLevel();
    },

    retry() {
        if (this.difficulty === 'baby') {
            this.score = this.levelScoreSnapshot || 0; // Restore score from start of level
            this.startLevel();
        } else {
            this.startSequence();
        }
    },

    home() {
        this.state = 'start';
        this.ui.showScreen('screen-start');
        AudioSystem.stopMusic();
    },

    gameOver(reason) {
        this.state = 'gameover';
        AudioSystem.stopMusic();
        AudioSystem.sfx('crash');
        document.getElementById('death-msg').innerText = reason;
        document.getElementById('final-score').innerText = this.score + " Bones";
        this.ui.showScreen('screen-gameover');
    },

    openShop() {
        this.state = 'shop';
        AudioSystem.stopMusic();
        this.levelScoreSnapshot = this.score; // Save for retry
        document.getElementById('shop-bones').innerText = this.score + ' 🦴';
        this.renderShop();
        this.ui.showScreen('shop-screen');
    },

    renderShop() {
        const grid = document.getElementById('shop-grid');
        grid.innerHTML = '';
        Object.values(CONFIG.hats).forEach(hat => {
            const isOwned = this.shop.inventory.includes(hat.id);
            const isEquipped = this.shop.equipped === hat.id;
            
            const card = document.createElement('div');
            card.className = `shop-card ${isOwned ? 'owned' : ''} ${isEquipped ? 'equipped' : ''}`;
            if (!isOwned && this.score < hat.cost) card.className += ' locked';

            let btnClass = isEquipped ? 'btn-equipped' : (isOwned ? 'btn-equip' : 'btn-buy');
            let btnText = isEquipped ? 'EQUIPPED' : (isOwned ? 'EQUIP' : `BUY ${hat.cost}`);

            card.innerHTML = `
                <div style="font-weight:900; margin-bottom:5px;">${hat.name}</div>
                <div style="font-size:10px; color:#636e72; margin-bottom:10px;">${hat.perk}</div>
                <canvas width="60" height="60" id="cvs-shop-${hat.id}"></canvas>
                <button class="card-btn ${btnClass}">${btnText}</button>
            `;
            
            // Generate preview
            setTimeout(() => {
                const c = document.getElementById(`cvs-shop-${hat.id}`);
                const cx = c.getContext('2d');
                Draw.husky(cx, 30, 35, 0, false, false, hat.id);
            }, 0);

            card.onclick = () => this.handleShopClick(hat);
            grid.appendChild(card);
        });
    },

    handleShopClick(hat) {
        if (this.shop.equipped === hat.id) return;

        if (this.shop.inventory.includes(hat.id)) {
            // Equip
            this.shop.equipped = hat.id;
            AudioSystem.sfx('collect');
        } else if (this.score >= hat.cost) {
            // Buy
            this.score -= hat.cost;
            this.shop.inventory.push(hat.id);
            this.shop.equipped = hat.id;
            AudioSystem.sfx('collect');
            document.getElementById('shop-bones').innerText = this.score + ' 🦴';
        } else {
            AudioSystem.sfx('crash');
            return;
        }
        this.renderShop();
    },

    // --- GAME LOOP ---
    loop(time) {
        requestAnimationFrame(t => this.loop(t));
        
        // 1. UPDATE
        if (this.state === 'playing') {
            const speed = CONFIG.baseSpeed + (this.level * 0.5) + (this.player.isMega ? 5 : 0);
            
            this.player.update();
            this.spawner.update();
            this.levelDist += speed * 0.1;

            // Level Progress
            const maxDist = 2000 + (this.level * 500);
            this.ui.updateProgress((this.levelDist / maxDist) * 100);
            if (this.levelDist >= maxDist) {
                this.openShop();
                return;
            }

            // Move Entities
            const moveAndCheck = (arr, isPickup) => {
                for (let i = arr.length - 1; i >= 0; i--) {
                    let e = arr[i];
                    e.x -= speed * (e.speedMod || 1);
                    
                    // Collision
                    const dx = Math.abs(100 - e.x); // Player is at x=100
                    const dy = Math.abs((this.player.y - 15) - e.y); // Approx center
                    
                    if (dx < 30 && dy < 30) {
                        if (isPickup) {
                            if (e.type === 'stick') this.player.collectStick();
                            else {
                                const mult = this.player.hat === 'cap' ? 2 : 1;
                                this.score += (e.type === 'gold' ? 5 : 1) * mult;
                                this.ui.updateScore(this.score);
                                AudioSystem.sfx('collect');
                                
                                // Mega progress
                                const target = this.player.hat === 'cowboy' ? 25 : 50;
                                this.player.streak += (e.type === 'gold' ? 5 : 1);
                                if (!this.player.isMega) {
                                    this.ui.updateMega((this.player.streak / target) * 100);
                                    if (this.player.streak >= target) {
                                        this.player.isMega = true;
                                        this.player.megaTimer = 600;
                                        this.ui.flash('#ff00ff');
                                        document.getElementById('mega-container').classList.add('active');
                                    }
                                }
                            }
                            arr.splice(i, 1);
                        } else {
                            // Obstacle Hit
                            if (this.player.isMega) {
                                AudioSystem.sfx('smash');
                                arr.splice(i, 1); // Destroy obstacle
                            } else {
                                if (this.player.hit()) {
                                    this.gameOver(`Hit by ${e.type.toUpperCase()}!`);
                                } else {
                                    arr.splice(i, 1); // Shield absorbed it
                                }
                            }
                        }
                    }
                    
                    if (e.x < -50) arr.splice(i, 1);
                }
            };

            moveAndCheck(this.obstacles, false);
            moveAndCheck(this.pickups, true);
        }

        // 2. RENDER
        const frame = Math.floor(time / 16);
        Draw.clear(this.ctx, this.width, this.height);
        
        // Dynamic Sky
        Draw.sky(this.ctx, this.width, this.height, this.level, this.levelDist);
        
        // Ground
        Draw.ground(this.ctx, this.width, this.height, this.groundY, CONFIG.baseSpeed, frame);

        if (this.state !== 'shop') {
            // Entities
            this.pickups.forEach(p => Draw.pickup(this.ctx, p));
            this.obstacles.forEach(o => Draw.obstacle(this.ctx, o));
            
            // Player
            // Note: Player logic uses this.player.isMega (boolean) but draw function derives color from timer
            Draw.husky(this.ctx, 100, this.player.y, frame, this.player.isMega, this.player.shield, this.player.hat);
        }
    }
};

// Start
Game.init();

</script>
