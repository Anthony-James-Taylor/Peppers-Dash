<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepper's Doo-Doo Dash V42</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS RESET & CORE LAYOUT */
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Montserrat', sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* UI OVERLAYS */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        .ui-layer.active { opacity: 1; pointer-events: auto; }
        .ui-bg { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); }
        
        /* HUD (Heads Up Display) */
        #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
        .hud-pill { background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 20px; color: white; font-weight: 900; text-align: center; }
        .hud-sub { font-size: 10px; color: #00fbff; display: block; }
        
        /* TYPOGRAPHY & BUTTONS */
        h1 { color: white; font-size: 40px; text-transform: uppercase; margin-bottom: 30px; text-shadow: 0 4px 0 #000; text-align: center; }
        .btn { background: white; color: #111; border: none; padding: 15px 40px; font-size: 18px; font-weight: 900; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 0 #b2bec3; transition: transform 0.1s; pointer-events: auto; margin: 10px; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-red { background: #ff7675; color: white; box-shadow: 0 5px 0 #d63031; }
        
        /* SHOP GRID */
        #shop-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-height: 60vh; overflow-y: auto; padding: 10px; }
        .shop-item { background: white; border-radius: 10px; padding: 15px; text-align: center; border: 4px solid #b2bec3; cursor: pointer; transition: transform 0.2s; width: 120px; }
        .shop-item.owned { border-color: #00b894; background: #e3faf5; }
        .shop-item.equipped { border-color: #0984e3; box-shadow: 0 0 15px #0984e3; transform: scale(1.05); }
        .shop-item.locked { opacity: 0.5; filter: grayscale(1); }
        
        /* FX */
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; pointer-events: none; opacity: 0; z-index: 100; transition: opacity 0.1s; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="flash"></div>

    <div id="hud">
        <div class="hud-pill">
            <span class="hud-sub">SCORE</span>
            <span id="scoreVal">0 🦴</span>
        </div>
        <div class="hud-pill">
            <span class="hud-sub">MEGA MODE</span>
            <div style="width:100px; height:8px; background:#444; margin-top:5px; border-radius:4px; overflow:hidden;">
                <div id="megaBar" style="width:0%; height:100%; background:#ff00ff; transition:width 0.2s;"></div>
            </div>
        </div>
    </div>

    <div id="screen-start" class="ui-layer ui-bg active">
        <h1>Pepper's<br>Doo-Doo Dash<br><span style="font-size:16px; color:#00fbff;">V42 STABLE CORE</span></h1>
        <button class="btn" onclick="Game.start()">PLAY GAME</button>
        <button class="btn btn-red" onclick="Game.setDifficulty('death'); Game.start()">DEATH MODE</button>
    </div>

    <div id="screen-shop" class="ui-layer ui-bg">
        <h1>The Pet Store</h1>
        <div class="hud-pill" style="margin-bottom:20px;">BANK: <span id="shopBank">0</span> 🦴</div>
        <div id="shop-container">
            </div>
        <button class="btn" onclick="Game.nextLevel()" style="margin-top:20px;">NEXT LEVEL ▶</button>
    </div>

    <div id="screen-gameover" class="ui-layer ui-bg">
        <h1 style="color:#ff7675;">GAME OVER</h1>
        <div class="hud-pill" style="margin-bottom:20px;">SCORE: <span id="finalScore">0</span></div>
        <div style="color:white; margin-bottom:20px; font-weight:bold;" id="deathReason"></div>
        <button class="btn" onclick="Game.home()">MAIN MENU</button>
        <button class="btn btn-red" onclick="Game.restart()">TRY AGAIN</button>
    </div>

<script>
/**
 * PEPPER'S DOO-DOO DASH V42 - Stable Core
 * Author: Elite Coder Logic
 * Intent: Maximum stability, clear control flow, robust asset-less rendering.
 */

// --- 1. CONFIGURATION & STATE ---
const CFG = {
    gravity: 0.6,          // Adjusted for 60fps
    jumpForce: -13,        // Adjusted for scale
    groundHeight: 120,
    baseSpeed: 8,
    colors: {
        sky: ['#81ecec', '#74b9ff'],
        ground: '#5D4037',
        grass: '#00b894'
    }
};

const HATS = {
    none:   { id: 'none', name: 'No Hat', cost: 0, perk: 'None' },
    cap:    { id: 'cap', name: 'Red Cap', cost: 50, perk: 'Double Points' },
    tophat: { id: 'tophat', name: 'Top Hat', cost: 100, perk: 'Shield Start' },
    cowboy: { id: 'cowboy', name: 'Cowboy', cost: 200, perk: 'Easy Mega' },
    space:  { id: 'space', name: 'Space Helm', cost: 300, perk: 'Moon Gravity' }
};

// Global Game State
const State = {
    active: false,
    screen: 'start', // start, play, shop, over
    frame: 0,
    score: 0,
    bones: 0, // Currency
    level: 1,
    distance: 0,
    difficulty: 'normal',
    
    // Player State
    player: {
        y: 0, dy: 0, grounded: true, 
        canDouble: false, shield: false, 
        isMega: false, megaTimer: 0, 
        streak: 0, magnetTimer: 0
    },
    
    // Inventory
    inventory: ['none'],
    equipped: 'none'
};

// --- 2. AUDIO SYSTEM (Robust & Lazy Load) ---
const AudioSys = {
    ctx: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    play(freq, type, dur, vol=0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur + 0.1);
    },
    sfx(key) {
        this.init();
        switch(key) {
            case 'jump': this.play(400, 'triangle', 0.2); break;
            case 'double': this.play(600, 'square', 0.1); break;
            case 'coin': this.play(1200, 'sine', 0.1, 0.2); break;
            case 'hit': this.play(100, 'sawtooth', 0.3, 0.3); break;
            case 'powerup': this.play(600, 'sine', 0.5, 0.2); break;
            case 'win': this.play(800, 'square', 0.4); break;
        }
    }
};

// --- 3. RENDERING ENGINE (Canvas API) ---
const Draw = {
    ctx: null,
    width: 0, height: 0, groundY: 0,

    init(canvasId) {
        const cvs = document.getElementById(canvasId);
        this.ctx = cvs.getContext('2d');
        this.resize(cvs);
        window.addEventListener('resize', () => this.resize(cvs));
    },

    resize(cvs) {
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        this.width = cvs.width;
        this.height = cvs.height;
        this.groundY = this.height - CFG.groundHeight;
    },

    clear() {
        const grad = this.ctx.createLinearGradient(0,0,0,this.height);
        grad.addColorStop(0, CFG.colors.sky[0]);
        grad.addColorStop(1, CFG.colors.sky[1]);
        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0,0,this.width, this.height);
    },

    ground(speed) {
        this.ctx.fillStyle = CFG.colors.ground;
        this.ctx.fillRect(0, this.groundY, this.width, CFG.groundHeight);
        this.ctx.fillStyle = CFG.colors.grass;
        this.ctx.fillRect(0, this.groundY, this.width, 20);
        
        // Striping
        this.ctx.fillStyle = "rgba(0,0,0,0.1)";
        const off = (State.frame * speed) % 100;
        for(let i = -100; i < this.width + 100; i+=100) {
            this.ctx.beginPath();
            this.ctx.moveTo(i-off, this.groundY);
            this.ctx.lineTo(i-off+40, this.height);
            this.ctx.lineTo(i-off+80, this.height);
            this.ctx.lineTo(i-off+40, this.groundY);
            this.ctx.fill();
        }
    },

    // Procedural Husky Drawing
    husky(x, y) {
        const ctx = this.ctx;
        ctx.save();
        ctx.translate(x, y);
        
        // Mega Mode Effect
        if(State.player.isMega) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = `hsl(${(State.frame*10)%360}, 100%, 50%)`;
            ctx.scale(1.2, 1.2);
        }

        // Bobbing
        ctx.translate(0, Math.sin(State.frame * 0.2) * 2);

        // Body
        ctx.fillStyle = '#2d3436';
        ctx.beginPath(); ctx.ellipse(0, 20, 20, 14, 0, 0, Math.PI*2); ctx.fill();

        // Head
        ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill();

        // Face
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(0, 5, 18, 0, Math.PI*2); ctx.fill();

        // Ears
        ctx.fillStyle = '#2d3436';
        ctx.beginPath(); ctx.moveTo(-15, -10); ctx.lineTo(-20, -35); ctx.lineTo(0, -15); ctx.fill();
        ctx.beginPath(); ctx.moveTo(15, -10); ctx.lineTo(20, -35); ctx.lineTo(0, -15); ctx.fill();

        // Eyes
        ctx.fillStyle = '#00fbff';
        ctx.beginPath(); ctx.arc(-8, -2, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -2, 4, 0, Math.PI*2); ctx.fill();

        // Draw Hat
        this.hat(State.equipped);

        // Shield
        if(State.player.shield) {
            ctx.strokeStyle = 'rgba(0, 251, 255, 0.6)';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0, 10, 40, 0, Math.PI*2); ctx.stroke();
        }

        ctx.restore();
    },

    hat(type) {
        const ctx = this.ctx;
        if(type === 'cap') {
            ctx.fillStyle = '#d63031';
            ctx.beginPath(); ctx.arc(0, -20, 14, Math.PI, 0); ctx.fill();
            ctx.fillRect(10, -20, 15, 4);
        } else if (type === 'tophat') {
            ctx.fillStyle = '#111';
            ctx.fillRect(-12, -50, 24, 30);
            ctx.fillRect(-18, -20, 36, 5);
        } else if (type === 'space') {
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, -5, 35, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        } else if (type === 'cowboy') {
            ctx.fillStyle = '#8B4513';
            ctx.beginPath(); ctx.ellipse(0, -20, 30, 5, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -25, 15, Math.PI, 0); ctx.fill();
        }
    },

    object(o) {
        const ctx = this.ctx;
        ctx.save();
        ctx.translate(o.x, o.y);
        
        if (o.type === 'poo') {
            ctx.fillStyle = '#8B4513';
            ctx.beginPath(); ctx.ellipse(0, 0, 15, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(0, -10, 10, 8, 0, 0, Math.PI*2); ctx.fill();
        } else if (o.type === 'hydrant') {
            ctx.fillStyle = '#d63031';
            ctx.fillRect(-10, -30, 20, 30);
            ctx.beginPath(); ctx.arc(0, -30, 10, Math.PI, 0); ctx.fill();
        } else if (o.type === 'vacuum') {
            ctx.fillStyle = '#636e72'; ctx.fillRect(-15, -10, 30, 10);
            ctx.fillStyle = '#d63031'; ctx.fillRect(-10, -50, 20, 40);
        } else if (o.type === 'squirrel') {
            ctx.fillStyle = '#e67e22';
            const hop = Math.abs(Math.sin(State.frame*0.2)*5);
            ctx.translate(0, -hop);
            ctx.beginPath(); ctx.ellipse(0, -5, 12, 6, 0, 0, Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(10, -15, 8, 0, Math.PI, false); ctx.fill();
        } else if (o.type === 'cat') {
            ctx.fillStyle = '#b2bec3';
            ctx.beginPath(); ctx.arc(0, -10, 15, Math.PI, 0); ctx.fill();
            ctx.beginPath(); ctx.arc(-12, -15, 8, 0, Math.PI*2); ctx.fill();
        } else if (o.type === 'bone' || o.type === 'gold') {
            ctx.translate(0, Math.sin(State.frame*0.1)*5);
            ctx.fillStyle = o.type === 'gold' ? '#f1c40f' : 'white';
            ctx.fillRect(-8, -3, 16, 6);
            ctx.beginPath(); ctx.arc(-8, 0, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, 0, 5, 0, Math.PI*2); ctx.fill();
        } else if (o.type === 'magnet') {
            ctx.fillStyle = '#ff7675';
            ctx.beginPath(); ctx.arc(0, 0, 12, Math.PI, 0); ctx.fill();
            ctx.fillStyle = 'white'; ctx.fillRect(-10,0,5,5); ctx.fillRect(5,0,5,5);
        }

        ctx.restore();
    }
};

// --- 4. GAME LOGIC CONTROLLER ---
const Game = {
    entities: [],
    particles: [],
    loopId: null,

    init() {
        Draw.init('gameCanvas');
        this.renderShop();
        
        // Input Handling (Touch + Mouse Unified)
        const jump = (e) => {
            if (e.target.tagName === 'BUTTON') return;
            e.preventDefault();
            if (State.screen === 'play') this.playerJump();
        };
        window.addEventListener('mousedown', jump);
        window.addEventListener('touchstart', jump, {passive: false});
    },

    setDifficulty(diff) {
        State.difficulty = diff;
    },

    start() {
        State.screen = 'play';
        State.level = 1;
        State.score = 0;
        State.bones = 0; // Session bones reset on full start
        this.resetLevel();
        this.uiSwitch('hud');
        this.loop();
    },

    restart() {
        if (State.difficulty === 'baby') {
            // Keep score, restart level
        } else {
            State.score = 0;
            State.level = 1;
        }
        this.resetLevel();
        this.uiSwitch('hud');
        this.loop();
    },

    nextLevel() {
        State.level++;
        this.resetLevel();
        this.uiSwitch('hud');
        this.loop();
    },

    home() {
        State.screen = 'start';
        this.stopLoop();
        this.uiSwitch('screen-start');
    },

    resetLevel() {
        State.active = true;
        State.frame = 0;
        State.distance = 0;
        State.player.y = 0;
        State.player.dy = 0;
        State.player.grounded = false;
        State.player.shield = (State.equipped === 'tophat' || State.equipped === 'space');
        State.player.isMega = false;
        State.player.streak = 0;
        
        // Hat Physics
        State.player.gravity = (State.equipped === 'space') ? 0.25 : CFG.gravity;
        State.player.jumpForce = (State.equipped === 'space') ? -8 : CFG.jumpForce;

        this.entities = [];
        this.spawnTimer = 0;
        
        // Update HUD immediate
        document.getElementById('scoreVal').innerText = State.score + " 🦴";
        document.getElementById('megaBar').style.width = "0%";
    },

    stopLoop() {
        if (this.loopId) cancelAnimationFrame(this.loopId);
        State.active = false;
    },

    // --- MAIN LOOP ---
    loop() {
        if (!State.active) return;
        this.loopId = requestAnimationFrame(() => this.loop());
        
        State.frame++;
        Draw.clear();
        
        // Speed calculation
        const speed = CFG.baseSpeed + (State.level * 0.5) + (State.player.isMega ? 4 : 0);
        Draw.ground(speed);

        this.updatePlayer();
        this.updateEntities(speed);
        this.spawnLogic();
        
        Draw.husky(100, Draw.groundY + State.player.y);

        // Level End
        const maxDist = 2000 + (State.level * 500);
        State.distance += speed * 0.1;
        if (State.distance >= maxDist) {
            this.stopLoop();
            this.uiSwitch('screen-shop');
            this.renderShop();
        }
    },

    updatePlayer() {
        const p = State.player;
        
        // Mega Logic
        if (p.megaTimer > 0) {
            p.megaTimer--;
            document.getElementById('megaBar').style.width = (p.megaTimer / 600 * 100) + "%";
            if (p.megaTimer <= 0) p.isMega = false;
        }

        // Magnet
        if (p.magnetTimer > 0) p.magnetTimer--;

        // Physics
        p.dy += p.gravity;
        p.y += p.dy;

        if (p.y > 0) {
            p.y = 0;
            p.dy = 0;
            p.grounded = true;
            p.canDouble = false;
        }
    },

    playerJump() {
        const p = State.player;
        if (p.grounded) {
            p.dy = p.jumpForce;
            p.grounded = false;
            p.canDouble = true;
            AudioSys.sfx('jump');
        } else if (p.canDouble) {
            p.dy = p.jumpForce * 0.8;
            p.canDouble = false;
            AudioSys.sfx('double');
        }
    },

    spawnLogic() {
        this.spawnTimer--;
        if (this.spawnTimer <= 0) {
            this.spawnTimer = Math.max(30, 100 - (State.level * 5));
            
            // Random Spawner
            const r = Math.random();
            let type = 'poo';
            let y = 0; // Relative to ground

            if (State.level >= 2 && r > 0.85) { type = 'vacuum'; }
            else if (State.level >= 2 && r > 0.75) { type = 'cat'; }
            else if (State.level >= 2 && r > 0.65) { type = 'squirrel'; }
            else if (r > 0.55) { type = 'hydrant'; }
            else if (r > 0.45) { type = 'bird'; y = -80; }
            else if (r > 0.3) { type = 'bone'; y = Math.random() > 0.5 ? -100 : -30; }
            else if (r > 0.25) { type = 'gold'; y = -30; }
            else if (r > 0.22) { type = 'magnet'; y = -50; }

            this.entities.push({
                x: Draw.width + 50,
                y: y,
                type: type,
                w: 30, h: 30,
                active: true
            });
        }
    },

    updateEntities(speed) {
        const p = State.player;
        const hitbox = 30; // forgiving hitbox

        this.entities.forEach(e => {
            if (!e.active) return;
            
            // Move
            let moveSpeed = speed;
            if (e.type === 'vacuum') moveSpeed *= 1.2;
            if (e.type === 'squirrel') moveSpeed *= 1.5;
            if (e.type === 'cat') moveSpeed = speed; // Static relative to scroll usually implies moving with ground, but here entities move towards player
            
            e.x -= moveSpeed;
            Draw.object({ x: e.x, y: Draw.groundY + e.y, type: e.type });

            // Magnet Effect
            if (p.magnetTimer > 0 && (e.type === 'bone' || e.type === 'gold')) {
                const dx = 100 - e.x;
                const dy = (p.y) - e.y; // Simplified
                if (Math.abs(dx) < 300) {
                    e.x += dx * 0.15;
                    e.y += dy * 0.15;
                }
            }

            // Collision
            const dx = Math.abs(100 - e.x);
            const dy = Math.abs((p.y - 15) - e.y); // Center point approx

            if (dx < hitbox && dy < hitbox) {
                if (['bone', 'gold', 'magnet'].includes(e.type)) {
                    // Pickup
                    e.active = false;
                    this.collectItem(e.type);
                } else {
                    // Hazard
                    if (p.isMega) {
                        e.active = false;
                        AudioSys.sfx('hit');
                    } else if (p.shield) {
                        p.shield = false;
                        e.active = false;
                        AudioSys.sfx('hit');
                        this.flash('#ff7675');
                    } else {
                        this.gameOver(`Hit by ${e.type.toUpperCase()}`);
                    }
                }
            }
        });
    },

    collectItem(type) {
        if (type === 'magnet') {
            State.player.magnetTimer = 600;
            AudioSys.sfx('powerup');
            return;
        }

        const val = (State.equipped === 'cap') ? 2 : 1;
        const points = (type === 'gold' ? 5 : 1) * val;
        
        State.score += points;
        State.bones += points;
        document.getElementById('scoreVal').innerText = State.score + " 🦴";
        AudioSys.sfx('coin');

        // Mega Progress
        const target = (State.equipped === 'cowboy') ? 25 : 50;
        State.player.streak += (type === 'gold' ? 5 : 1);
        
        if (!State.player.isMega) {
            const pct = Math.min(100, (State.player.streak / target) * 100);
            document.getElementById('megaBar').style.width = pct + "%";
            if (State.player.streak >= target) {
                State.player.isMega = true;
                State.player.megaTimer = 600;
                AudioSys.sfx('powerup');
            }
        }
    },

    gameOver(reason) {
        this.stopLoop();
        AudioSys.sfx('hit');
        document.getElementById('deathReason').innerText = reason;
        document.getElementById('finalScore').innerText = State.score;
        this.uiSwitch('screen-gameover');
    },

    // --- UI HELPERS ---
    uiSwitch(id) {
        document.querySelectorAll('.ui-layer').forEach(el => el.classList.remove('active'));
        if(id === 'hud') {
            document.getElementById('hud').style.opacity = 1;
        } else {
            document.getElementById('hud').style.opacity = 0;
            document.getElementById(id).classList.add('active');
        }
    },

    flash(color) {
        const f = document.getElementById('flash');
        f.style.background = color;
        f.style.opacity = 0.5;
        setTimeout(() => f.style.opacity = 0, 100);
    },

    renderShop() {
        const grid = document.getElementById('shop-container');
        document.getElementById('shopBank').innerText = State.bones;
        grid.innerHTML = '';

        Object.values(HATS).forEach(hat => {
            const owned = State.inventory.includes(hat.id);
            const equipped = State.equipped === hat.id;
            const afford = State.bones >= hat.cost;

            const div = document.createElement('div');
            div.className = `shop-item ${owned?'owned':''} ${equipped?'equipped':''} ${(!owned && !afford)?'locked':''}`;
            div.innerHTML = `
                <div style="font-weight:900">${hat.name}</div>
                <div style="font-size:10px; margin:5px 0;">${hat.perk}</div>
                <div style="font-weight:bold; color:${owned?'#00b894':'#d63031'}">${owned ? (equipped?'EQUIPPED':'OWNED') : hat.cost+' 🦴'}</div>
            `;
            div.onclick = () => {
                if(equipped) return;
                if(owned) {
                    State.equipped = hat.id;
                    AudioSys.sfx('coin');
                } else if (afford) {
                    State.bones -= hat.cost;
                    State.inventory.push(hat.id);
                    State.equipped = hat.id;
                    AudioSys.sfx('powerup');
                }
                this.renderShop();
            };
            grid.appendChild(div);
        });
    }
};

// Start
Game.init();

</script>
