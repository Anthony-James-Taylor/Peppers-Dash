<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepper's Doo-Doo Dash V44</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body { 
            margin: 0; overflow: hidden; background: #1a1a1a; 
            font-family: 'Montserrat', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none; 
        }
        
        /* UI LAYERS */
        #ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; display: none; 
            flex-direction: column; align-items: center; z-index: 10; 
        }

        /* HUD PILLS */
        .hud-top { display: flex; justify-content: space-between; width: 90%; margin-top: 20px; align-items: flex-start; }
        
        .glass-pill {
            background: rgba(0, 0, 0, 0.8); 
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 16px; padding: 10px 25px; 
            color: white; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); backdrop-filter: blur(4px);
        }
        
        #score { font-size: 24px; font-weight: 900; color: #fff; }
        #stick-text { font-size: 20px; font-weight: 900; color: #00b894; }

        /* PROGRESS BAR */
        #progress-wrapper {
            position: absolute; top: 100px; width: 70%; height: 10px;
            background: rgba(0,0,0,0.6); border-radius: 5px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        #progress-fill { height: 100%; width: 0%; background: #00fbff; box-shadow: 0 0 10px #00fbff; border-radius: 4px; }
        #finish-icon { position: absolute; right: -30px; top: -30px; font-size: 40px; }

        /* MEGA METER */
        #mega-meter {
            position: absolute; bottom: 40px; 
            background: rgba(0, 0, 0, 0.9); 
            border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 16px; 
            padding: 10px 30px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: all 0.2s;
        }
        #mega-label { color: #00fbff; font-size: 12px; font-weight: 900; margin-bottom: 5px; }
        #mega-bar-container { width: 200px; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
        #mega-bar-fill { height: 100%; width: 0%; background: #ff00ff; transition: width 0.1s; }
        
        .mega-active { border-color: #ff00ff !important; box-shadow: 0 0 20px #ff00ff !important; transform: scale(1.05); }

        /* SCREENS */
        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 200; text-align: center; 
        }
        
        #start-screen { display: flex; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); }
        
        h1 { 
            color: #fff; font-size: 50px; margin: 0 0 40px 0; line-height: 1; font-weight: 900; 
            text-shadow: 0 5px 0 #000; text-transform: uppercase;
        }

        .btn { 
            background: white; color: #2d3436; padding: 20px 60px; border-radius: 30px; 
            font-size: 22px; font-weight: 900; border: none; cursor: pointer; 
            box-shadow: 0 8px 0 #b2bec3; transition: transform 0.1s; margin-top: 10px;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #b2bec3; }

        /* DIFFICULTY CARDS */
        .diff-container { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        .diff-card { 
            background: rgba(255,255,255,0.1); border: 2px solid transparent; border-radius: 12px; 
            padding: 20px; width: 200px; text-align: left; cursor: pointer; transition: 0.2s;
        }
        .diff-card:hover { background: rgba(255,255,255,0.2); }
        .diff-card.selected { border-color: #00fbff; background: rgba(0,251,255,0.15); }
        .diff-card h3 { color: #ffeaa7; margin: 0 0 5px 0; font-size: 16px; text-transform: uppercase; }
        .diff-card p { color: #ccc; font-size: 11px; margin: 0; line-height: 1.4; }

        /* SHOP (V40 STYLE GRID) */
        #shop-screen { background: linear-gradient(135deg, #74b9ff, #0984e3); justify-content: flex-start; padding-top: 20px; }
        #shop-header { display: flex; justify-content: space-between; width: 90%; align-items: center; margin-bottom: 20px; }
        
        #shop-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
            gap: 20px; width: 90%; max-width: 800px; padding-bottom: 100px; overflow-y: auto;
        }

        .shop-card {
            background: white; border-radius: 15px; border: 4px solid #b2bec3;
            padding: 10px; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: transform 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .shop-card.owned { border-color: #00b894; background: #e3faf5; }
        .shop-card.equipped { border-color: #0984e3; transform: scale(1.05); box-shadow: 0 0 20px #00fbff; }
        .shop-card.locked { opacity: 0.6; filter: grayscale(1); }

        .shop-btn { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: none; font-weight: 900; cursor: pointer; color: white; font-size: 10px; }

        /* FLASH OVERLAY */
        #flash { position: absolute; top:0; left:0; width:100%; height:100%; background:white; opacity:0; pointer-events:none; z-index:999; transition: opacity 0.1s; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="flash"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="glass-pill">
                <div style="font-size:10px; color:#00fbff; font-weight:900;">SCORE</div>
                <div id="score">0 🦴</div>
            </div>
            <div class="glass-pill">
                <div style="font-size:10px; color:#00b894; font-weight:900;">SHIELD</div>
                <div id="stick-text">0/5</div>
            </div>
        </div>
        <div id="progress-wrapper"><div id="progress-fill"></div><div id="finish-icon">🏁</div></div>
        
        <div id="mega-meter">
            <div id="mega-label">MEGA MODE</div>
            <div id="mega-bar-container"><div id="mega-bar-fill"></div></div>
        </div>
    </div>

    <div id="start-screen" class="screen" style="display:flex;">
        <h1>Pepper's<br>Doo-Doo Dash</h1>
        
        <div class="diff-container">
            <div class="diff-card" onclick="setDifficulty('baby', this)">
                <h3>Baby Mode</h3>
                <p>Restart same level if you die.</p>
            </div>
            <div class="diff-card selected" onclick="setDifficulty('normal', this)">
                <h3>Normal</h3>
                <p>Standard rules. Bring 'em on.</p>
            </div>
            <div class="diff-card" onclick="setDifficulty('death', this)">
                <h3 style="color:#ff7675">Death</h3>
                <p>Fast. No Shields. Good luck.</p>
            </div>
        </div>

        <button class="btn" id="start-btn">PLAY GAME</button>
    </div>

    <div id="shop-screen" class="screen">
        <div id="shop-header">
            <div class="glass-pill">BANK: <span id="shop-balance" style="color:#f1c40f">0</span> 🦴</div>
        </div>
        <div id="shop-grid"></div>
        <div style="position:fixed; bottom:20px; width:100%; display:flex; justify-content:center;">
            <button class="btn" id="next-level-btn">NEXT LEVEL ▶</button>
        </div>
    </div>

    <div id="game-over" class="screen">
        <h1 style="color:#ff7675">GAME OVER</h1>
        <div style="color:white; margin-bottom:20px; font-weight:bold; font-size:18px;" id="death-reason"></div>
        <div class="glass-pill" style="margin-bottom:20px;">SCORE: <span id="final-score">0</span></div>
        <button class="btn" id="retry-btn">TRY AGAIN</button>
        <button class="btn" id="home-btn" style="background:transparent; border:2px solid white; color:white; font-size:16px; padding:10px 30px;">MAIN MENU</button>
    </div>

<script>
    // --- SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const uiLayer = document.getElementById('ui-layer');
    const startScreen = document.getElementById('start-screen');
    const shopScreen = document.getElementById('shop-screen');
    const gameOverScreen = document.getElementById('game-over');
    
    // Resize
    let width, height, groundY;
    const GROUND_HEIGHT = 140;
    
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        groundY = height - GROUND_HEIGHT;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- AUDIO SYSTEM (Oscillator based - No files) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        
        if (type === 'jump') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(500, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }
        else if (type === 'collect') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        }
        else if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
        else if (type === 'mega') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(600, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    // --- GAME STATE ---
    let gameActive = false;
    let frame = 0;
    let score = 0;
    let bonesBank = 0;
    let level = 1;
    let distance = 0;
    let maxDistance = 2000;
    let difficulty = 'normal';
    
    // Pepper
    let pepper = {
        x: 100, y: 0, dy: 0,
        grounded: true, canDouble: false,
        hat: 'none', shield: false,
        isMega: false, megaTimer: 0, streak: 0,
        sticks: 0
    };

    // Arrays
    let obstacles = [];
    let items = [];
    let particles = [];
    
    // Decoration
    let mountains = [];
    let clouds = [];

    // --- SHOP DATA ---
    const HATS = {
        none:   { id: 'none', name: 'No Hat', cost: 0, perk: 'Natural' },
        cap:    { id: 'cap', name: 'Red Cap', cost: 50, perk: 'Double Points' },
        tophat: { id: 'tophat', name: 'Top Hat', cost: 100, perk: 'Start w/ Shield' },
        cowboy: { id: 'cowboy', name: 'Cowboy', cost: 200, perk: 'Easy Mega Mode' },
        space:  { id: 'space', name: 'Space Helm', cost: 300, perk: 'Moon Gravity' }
    };
    let inventory = ['none'];
    let equipped = 'none';

    // --- INITIALIZATION ---
    function resetLevel() {
        pepper.y = groundY;
        pepper.dy = 0;
        pepper.grounded = true;
        pepper.isMega = false;
        pepper.megaTimer = 0;
        pepper.streak = 0;
        pepper.sticks = 0;
        pepper.shield = false;
        
        // Hat perks
        pepper.hat = equipped;
        if(pepper.hat === 'tophat') { pepper.shield = true; pepper.sticks = 5; }
        if(pepper.hat === 'space') pepper.shield = true; // Bonus shield for space

        obstacles = [];
        items = [];
        distance = 0;
        maxDistance = 2000 + (level * 500);
        
        // Background init
        mountains = []; for(let i=0; i<5; i++) mountains.push({x:i*300});
        clouds = []; for(let i=0; i<5; i++) clouds.push({x:Math.random()*width, y:Math.random()*150, s:0.5+Math.random()});

        updateHUD();
    }

    function startGame() {
        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        shopScreen.style.display = 'none';
        uiLayer.style.display = 'flex';
        
        score = 0;
        level = 1;
        initAudio();
        resetLevel();
        gameActive = true;
        loop();
    }

    function setDifficulty(mode, el) {
        difficulty = mode;
        document.querySelectorAll('.diff-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
    }

    // --- GAME LOOP ---
    function loop() {
        if (!gameActive) return;
        requestAnimationFrame(loop);
        frame++;
        
        const speed = 10 + (level * 0.5) + (pepper.isMega ? 5 : 0);
        
        updatePhysics(speed);
        updateEntities(speed);
        draw();
        
        // Distance
        distance += speed * 0.1;
        document.getElementById('progress-fill').style.width = Math.min(100, (distance/maxDistance)*100) + '%';
        
        if(distance >= maxDistance) {
            gameActive = false;
            playSound('mega');
            openShop();
        }
    }

    // --- PHYSICS & LOGIC ---
    function updatePhysics(speed) {
        // Player Gravity
        let grav = (pepper.hat === 'space') ? 0.6 : 1.1; // Floatier if space helm
        pepper.dy += grav;
        pepper.y += pepper.dy;
        
        // Ground Collision
        if (pepper.y >= groundY) {
            pepper.y = groundY;
            pepper.dy = 0;
            pepper.grounded = true;
            pepper.canDouble = false;
        }

        // Mega Timer
        if (pepper.isMega) {
            pepper.megaTimer--;
            document.getElementById('mega-bar-fill').style.width = (pepper.megaTimer/600 * 100) + "%";
            if(pepper.megaTimer <= 0) {
                pepper.isMega = false;
                pepper.streak = 0;
                document.getElementById('mega-meter').classList.remove('mega-active');
            }
        }

        // Spawning
        if (frame % Math.max(30, 90 - (level*5)) === 0) {
            if (Math.random() > 0.3) spawnObstacle();
            else spawnItem();
        }
    }

    function spawnObstacle() {
        const r = Math.random();
        let type = 'poo';
        let y = groundY;
        
        if (level >= 3 && r > 0.9) type = 'vacuum';
        else if (level >= 2 && r > 0.8) type = 'squirrel';
        else if (level >= 2 && r > 0.7) type = 'cat';
        else if (r > 0.55) type = 'hydrant';
        else if (r > 0.4) { type = 'bird'; y = groundY - 90; }
        
        obstacles.push({ x: width + 50, y: y, type: type, w: 30, h: 30 });
    }

    function spawnItem() {
        const r = Math.random();
        let type = 'white';
        let y = groundY - (Math.random() > 0.5 ? 120 : 40);
        
        if (r > 0.9) type = 'stick';
        else if (r > 0.7) type = 'gold';
        
        items.push({ x: width + 50, y: y, type: type });
    }

    function updateEntities(speed) {
        // Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let o = obstacles[i];
            let moveSpeed = speed;
            if(o.type === 'vacuum') moveSpeed *= 1.3;
            if(o.type === 'squirrel') moveSpeed *= 1.5;
            
            o.x -= moveSpeed;
            
            // Collision
            if (Math.abs(100 - o.x) < 30 && Math.abs((pepper.y - 20) - o.y) < 30) {
                if (pepper.isMega) {
                    playSound('crash');
                    obstacles.splice(i, 1);
                } else if (pepper.shield) {
                    pepper.shield = false;
                    pepper.sticks = 0;
                    playSound('crash');
                    flashScreen('red');
                    obstacles.splice(i, 1);
                    updateHUD();
                } else {
                    gameOver(o.type);
                }
            } else if (o.x < -50) {
                obstacles.splice(i, 1);
            }
        }

        // Items
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.x -= speed;
            
            if (Math.abs(100 - item.x) < 30 && Math.abs((pepper.y - 20) - item.y) < 30) {
                collectItem(item.type);
                items.splice(i, 1);
            } else if (item.x < -50) {
                items.splice(i, 1);
            }
        }
    }

    function collectItem(type) {
        playSound('collect');
        if (type === 'stick') {
            if (difficulty === 'death') return;
            pepper.sticks++;
            if(pepper.sticks >= 5) {
                pepper.shield = true;
                pepper.sticks = 0;
                flashScreen('#00b894');
                playSound('mega');
            }
        } else {
            let val = (type === 'gold') ? 5 : 1;
            if(pepper.hat === 'cap') val *= 2;
            score += val;
            bonesBank += val;
            
            // Mega logic
            const target = (pepper.hat === 'cowboy') ? 25 : 50;
            pepper.streak += val;
            if(!pepper.isMega && pepper.streak >= target) {
                pepper.isMega = true;
                pepper.megaTimer = 600;
                document.getElementById('mega-meter').classList.add('mega-active');
                playSound('mega');
                flashScreen('#ff00ff');
            }
            if(!pepper.isMega) {
                document.getElementById('mega-bar-fill').style.width = (pepper.streak/target * 100) + "%";
            }
        }
        updateHUD();
    }

    function updateHUD() {
        document.getElementById('score').innerText = score + " 🦴";
        document.getElementById('stick-text').innerText = pepper.sticks + "/5";
    }

    function flashScreen(color) {
        const f = document.getElementById('flash');
        f.style.background = color;
        f.style.opacity = 0.5;
        setTimeout(() => f.style.opacity = 0, 100);
    }

    function gameOver(reason) {
        gameActive = false;
        playSound('crash');
        uiLayer.style.display = 'none';
        gameOverScreen.style.display = 'flex';
        document.getElementById('death-reason').innerText = "HIT BY " + reason.toUpperCase();
        document.getElementById('final-score').innerText = score;
    }

    // --- RENDERER ---
    function draw() {
        // Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#81ecec'); grad.addColorStop(1, '#74b9ff');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Parallax Mountains
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        mountains.forEach(m => {
            m.x -= 0.5; if(m.x < -300) m.x = width;
            ctx.beginPath(); ctx.moveTo(m.x, groundY); ctx.lineTo(m.x+150, groundY-300); ctx.lineTo(m.x+300, groundY); ctx.fill();
        });

        // Ground
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(0, groundY, width, GROUND_HEIGHT);
        ctx.fillStyle = '#00b894';
        ctx.fillRect(0, groundY, width, 20);

        // Entities
        items.forEach(drawItem);
        obstacles.forEach(drawObstacle);
        drawPepper();
    }

    function drawPepper() {
        ctx.save();
        ctx.translate(100, pepper.y);
        
        if (pepper.isMega) {
            ctx.scale(1.5, 1.5);
            ctx.shadowBlur = 20;
            ctx.shadowColor = `hsl(${frame*10}, 100%, 50%)`;
        }

        // Bobbing
        ctx.translate(0, Math.sin(frame*0.3)*2);

        // Body
        ctx.fillStyle = '#2d3436';
        ctx.beginPath(); ctx.ellipse(0, -20, 20, 12, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, -40, 22, 0, Math.PI*2); ctx.fill(); // Head
        
        // Face
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(0, -35, 16, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2d3436';
        ctx.beginPath(); ctx.moveTo(-15,-50); ctx.lineTo(-20,-75); ctx.lineTo(0,-55); ctx.fill();
        ctx.beginPath(); ctx.moveTo(15,-50); ctx.lineTo(20,-75); ctx.lineTo(0,-55); ctx.fill();

        // Eyes
        ctx.fillStyle = '#00fbff';
        ctx.beginPath(); ctx.arc(-8, -42, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -42, 4, 0, Math.PI*2); ctx.fill();

        drawHat();

        // Shield
        if (pepper.shield) {
            ctx.strokeStyle = '#00b894'; ctx.lineWidth = 3;
            const r = frame * 0.1;
            for(let i=0; i<3; i++) {
                let a = r + (i*Math.PI*2/3);
                let sx = Math.cos(a)*40; let sy = Math.sin(a)*40 - 30;
                ctx.beginPath(); ctx.moveTo(sx-5, sy); ctx.lineTo(sx+5, sy); ctx.stroke();
            }
        }

        ctx.restore();
    }

    function drawHat() {
        const type = pepper.hat;
        if(type === 'cap') {
            ctx.fillStyle = '#d63031';
            ctx.beginPath(); ctx.arc(0, -58, 14, Math.PI, 0); ctx.fill();
            ctx.fillRect(8, -58, 12, 4);
        } else if (type === 'tophat') {
            ctx.fillStyle = '#111'; ctx.fillRect(-12, -85, 24, 30); ctx.fillRect(-18, -55, 36, 5);
        } else if (type === 'space') {
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.fillStyle='rgba(100,200,255,0.3)';
            ctx.beginPath(); ctx.arc(0, -40, 35, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        } else if (type === 'cowboy') {
            ctx.fillStyle = '#8B4513';
            ctx.beginPath(); ctx.ellipse(0, -55, 30, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -60, 14, Math.PI, 0); ctx.fill();
        }
    }

    function drawObstacle(o) {
        ctx.save();
        ctx.translate(o.x, o.y);
        
        if (o.type === 'poo') {
            ctx.fillStyle = '#8B4513';
            ctx.beginPath(); ctx.ellipse(0, -5, 15, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(0, -15, 10, 8, 0, 0, Math.PI*2); ctx.fill();
        } else if (o.type === 'hydrant') {
            ctx.fillStyle = '#d63031'; ctx.fillRect(-10, -30, 20, 30);
            ctx.beginPath(); ctx.arc(0, -30, 10, Math.PI, 0); ctx.fill();
        } else if (o.type === 'vacuum') {
            ctx.fillStyle = '#636e72'; ctx.fillRect(-15, -10, 30, 10);
            ctx.fillStyle = '#d63031'; ctx.fillRect(-10, -50, 20, 40);
        } else if (o.type === 'squirrel') {
            ctx.fillStyle = '#e67e22'; ctx.translate(0, Math.sin(frame*0.2)*-5);
            ctx.beginPath(); ctx.ellipse(0, -5, 12, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -15, 8, 0, Math.PI, false); ctx.fill();
        } else if (o.type === 'cat') {
            ctx.fillStyle = '#b2bec3';
            ctx.beginPath(); ctx.arc(0, -10, 15, Math.PI, 0); ctx.fill();
            ctx.beginPath(); ctx.arc(-12, -20, 10, 0, Math.PI*2); ctx.fill();
        } else if (o.type === 'bird') {
            ctx.fillStyle = '#2d3436';
            ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(15, -10 + Math.sin(frame)*10); ctx.lineTo(5, 5); ctx.fill();
        }
        ctx.restore();
    }

    function drawItem(i) {
        ctx.save();
        ctx.translate(i.x, i.y + Math.sin(frame*0.1)*5);
        if (i.type === 'stick') {
            ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(-10, 5); ctx.lineTo(10, -5); ctx.stroke();
            ctx.fillStyle = '#00b894'; ctx.beginPath(); ctx.arc(10, -5, 4, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = (i.type === 'gold') ? '#f1c40f' : 'white';
            ctx.fillRect(-8,-3,16,6);
            ctx.beginPath(); ctx.arc(-8,0,5,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8,0,5,0,Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }

    // --- INPUT ---
    function jumpInput(e) {
        if (!gameActive) return;
        if(e.target.tagName === 'BUTTON') return;
        
        let jumpForce = (pepper.hat === 'space') ? -10 : -15; // Adjusted physics
        
        if (pepper.grounded) {
            pepper.dy = jumpForce;
            pepper.grounded = false;
            pepper.canDouble = true;
            playSound('jump');
        } else if (pepper.canDouble) {
            pepper.dy = jumpForce * 0.8;
            pepper.canDouble = false;
            playSound('jump');
        }
    }
    window.addEventListener('mousedown', jumpInput);
    window.addEventListener('touchstart', (e) => { e.preventDefault(); jumpInput(e); }, {passive:false});

    // --- BUTTONS ---
    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('retry-btn').onclick = () => {
        gameOverScreen.style.display = 'none';
        if (difficulty === 'baby') {
            gameActive = true; resetLevel(); loop(); // Keep score
        } else {
            startGame(); // Full reset
        }
    };
    document.getElementById('home-btn').onclick = () => {
        gameOverScreen.style.display = 'none';
        startScreen.style.display = 'flex';
    };
    document.getElementById('next-level-btn').onclick = () => {
        level++;
        shopScreen.style.display = 'none';
        uiLayer.style.display = 'flex';
        resetLevel();
        gameActive = true;
        loop();
    };

    function openShop() {
        shopScreen.style.display = 'flex';
        uiLayer.style.display = 'none';
        renderShop();
    }

    function renderShop() {
        const grid = document.getElementById('shop-grid');
        document.getElementById('shop-balance').innerText = bonesBank;
        grid.innerHTML = '';

        Object.values(HATS).forEach(hat => {
            const isOwned = inventory.includes(hat.id);
            const isEquipped = equipped === hat.id;
            const canAfford = bonesBank >= hat.cost;

            const el = document.createElement('div');
            el.className = `shop-card ${isOwned?'owned':''} ${isEquipped?'equipped':''} ${(!isOwned && !canAfford)?'locked':''}`;
            
            let btnText = isEquipped ? 'EQUIPPED' : (isOwned ? 'EQUIP' : `BUY ${hat.cost}`);
            let btnColor = isEquipped ? '#0984e3' : (isOwned ? '#00b894' : '#d63031');

            el.innerHTML = `
                <div style="font-weight:900">${hat.name}</div>
                <div style="font-size:10px; color:#636e72; margin:10px 0;">${hat.perk}</div>
                <canvas id="cvs-${hat.id}" width="60" height="60"></canvas>
                <button class="shop-btn" style="background:${btnColor}">${btnText}</button>
            `;
            
            // Preview
            setTimeout(() => {
                const cx = document.getElementById(`cvs-${hat.id}`).getContext('2d');
                Draw.ctx = cx; // Hack swap context
                cx.translate(30, 50); 
                Draw.hat(hat.id);
                // Draw simple head
                cx.fillStyle='#2d3436'; cx.beginPath(); cx.arc(0,0,15,0,Math.PI*2); cx.fill();
                Draw.ctx = ctx; // Restore
            }, 0);

            el.onclick = () => {
                if(isEquipped) return;
                if(isOwned) {
                    equipped = hat.id;
                    playSound('collect');
                } else if(canAfford) {
                    bonesBank -= hat.cost;
                    inventory.push(hat.id);
                    equipped = hat.id;
                    playSound('mega');
                } else {
                    playSound('crash');
                }
                renderShop();
            };
            grid.appendChild(el);
        });
    }

</script>
</body>
</html>
