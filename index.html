<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepper's Doo-Doo Dash V43 (Stable)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* CORE RESET */
        body { margin: 0; overflow: hidden; background: #2d3436; font-family: 'Montserrat', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI LAYOUTS */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 10;
        }
        .screen.active { display: flex; }

        /* HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none;
        }
        .hud-top { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; }
        .pill { background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); font-weight: 900; }
        
        #progress-bar-container {
            position: absolute; top: 80px; left: 10%; width: 80%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px;
        }
        #progress-fill { width: 0%; height: 100%; background: #00fbff; border-radius: 4px; transition: width 0.1s linear; }

        #mega-meter {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 10px 30px; border-radius: 12px; border: 2px solid white;
            display: flex; flex-direction: column; align-items: center; transition: all 0.2s;
        }
        #mega-meter.active { border-color: #ff00ff; box-shadow: 0 0 20px #ff00ff; transform: translateX(-50%) scale(1.1); }
        #mega-fill { width: 0%; height: 8px; background: #ff00ff; margin-top: 5px; border-radius: 4px; width: 150px; }

        /* CARDS & BUTTONS */
        h1 { color: white; font-size: 40px; text-transform: uppercase; text-align: center; margin-bottom: 30px; text-shadow: 0 5px 0 black; }
        
        .btn {
            background: white; border: none; padding: 15px 40px; font-size: 20px; font-weight: 900;
            border-radius: 30px; cursor: pointer; margin: 10px; box-shadow: 0 5px 0 #b2bec3;
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }

        /* DIFFICULTY CARDS */
        .diff-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .diff-card {
            background: rgba(255,255,255,0.1); border: 2px solid transparent; border-radius: 12px;
            padding: 20px; width: 280px; text-align: left; cursor: pointer; transition: all 0.2s;
        }
        .diff-card:hover { background: rgba(255,255,255,0.2); }
        .diff-card.selected { border-color: #00fbff; background: rgba(0, 251, 255, 0.1); }
        .diff-card h3 { color: #ffeaa7; margin: 0 0 5px 0; font-size: 18px; text-transform: uppercase; }
        .diff-card p { color: #ccc; font-size: 12px; margin: 0; line-height: 1.4; }

        /* SHOP */
        #shop-screen { background: linear-gradient(135deg, #74b9ff, #0984e3); display: none; justify-content: flex-start; padding-top: 20px; overflow-y: auto; }
        #shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 90%; max-width: 600px; margin-top: 20px; padding-bottom: 100px; }
        .shop-item {
            background: white; border-radius: 10px; padding: 10px; text-align: center; border: 4px solid #b2bec3; cursor: pointer;
        }
        .shop-item.owned { border-color: #00b894; background: #e6fffa; }
        .shop-item.equipped { border-color: #0984e3; transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        
        /* FX */
        #flash { position: absolute; top:0; left:0; width:100%; height:100%; background:white; opacity:0; pointer-events:none; z-index:999; transition: opacity 0.1s; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="flash"></div>

    <div id="hud">
        <div class="hud-top">
            <div class="pill">SCORE: <span id="scoreVal">0</span></div>
            <div class="pill" id="shieldPill">SHIELD: <span id="shieldVal">0/5</span></div>
        </div>
        <div id="progress-bar-container"><div id="progress-fill"></div></div>
        <div id="mega-meter">
            <div style="color:#00fbff; font-weight:900; font-size:12px;">MEGA MODE</div>
            <div style="width:150px; height:8px; background:#333; margin-top:5px; border-radius:4px; overflow:hidden;">
                <div id="mega-fill" style="width:0%; height:100%; background:#ff00ff;"></div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="screen active">
        <h1>Pepper's<br>Doo-Doo Dash<br><span style="font-size:20px; color:#00fbff">V43 STABLE</span></h1>
        
        <div class="diff-container">
            <div class="diff-card" onclick="Game.setDiff('baby', this)">
                <h3>Baby Mode</h3>
                <p>Can I play, Daddy? (Restarts Level)</p>
            </div>
            <div class="diff-card selected" onclick="Game.setDiff('normal', this)">
                <h3>Normal</h3>
                <p>Bring 'em on. (Standard rules)</p>
            </div>
            <div class="diff-card" onclick="Game.setDiff('death', this)">
                <h3 style="color:#ff7675">Death Mode</h3>
                <p>I am Death Incarnate! (Fast, No Shields)</p>
            </div>
        </div>

        <button class="btn" style="margin-top:30px;" onclick="Game.start()">START RUN</button>
    </div>

    <div id="shop-screen" class="screen">
        <div class="pill" style="margin-top:20px;">BANK: <span id="shop-bank">0</span> 🦴</div>
        <div id="shop-grid"></div>
        <div style="position:fixed; bottom:20px;">
            <button class="btn" onclick="Game.nextLevel()">NEXT LEVEL ▶</button>
        </div>
    </div>

    <div id="game-over" class="screen">
        <h1 style="color:#ff7675">GAME OVER</h1>
        <div style="color:white; margin-bottom:20px; font-weight:bold;" id="death-msg"></div>
        <div class="pill">SCORE: <span id="final-score">0</span></div>
        <div style="margin-top:30px;">
            <button class="btn" onclick="Game.retry()">RETRY</button>
            <button class="btn" onclick="Game.home()">HOME</button>
        </div>
    </div>

<script>
/**
 * PEPPER'S DOO-DOO DASH V43
 * Architecture: Singleton Game Object + Stateless Renderer
 */

// --- CONFIGURATION ---
const CONSTANTS = {
    GRAVITY: 0.6,
    JUMP_FORCE: -12,
    GROUND_Y: 140, // Distance from bottom
    BASE_SPEED: 8
};

const HATS = {
    none:   { id: 'none', name: 'No Hat', cost: 0, perk: 'None' },
    cap:    { id: 'cap', name: 'Red Cap', cost: 50, perk: '2x Bones' },
    tophat: { id: 'tophat', name: 'Top Hat', cost: 100, perk: 'Shield Start' },
    cowboy: { id: 'cowboy', name: 'Cowboy', cost: 200, perk: 'Fast Mega' },
    space:  { id: 'space', name: 'Space Helm', cost: 300, perk: 'Moon Gravity' }
};

// --- AUDIO (Lazy Load) ---
const AudioSys = {
    ctx: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    play(freq, type, dur) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur + 0.1);
    },
    sfx(id) {
        this.init();
        switch(id) {
            case 'jump': this.play(400, 'triangle', 0.2); break;
            case 'double': this.play(600, 'square', 0.1); break;
            case 'coin': this.play(1200, 'sine', 0.1); break;
            case 'hit': this.play(100, 'sawtooth', 0.3); break;
            case 'power': this.play(600, 'sine', 0.5); break;
        }
    }
};

// --- RENDERER ---
const Draw = {
    ctx: null,
    width: 0, height: 0,
    init(canvas) {
        this.ctx = canvas.getContext('2d');
        this.resize(canvas);
        window.addEventListener('resize', () => this.resize(canvas));
    },
    resize(canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        this.width = canvas.width;
        this.height = canvas.height;
    },
    clear() {
        const grad = this.ctx.createLinearGradient(0,0,0,this.height);
        grad.addColorStop(0, '#81ecec'); grad.addColorStop(1, '#74b9ff');
        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0,0,this.width, this.height);
    },
    ground(speed, frame) {
        const y = this.height - CONSTANTS.GROUND_Y;
        this.ctx.fillStyle = '#5D4037';
        this.ctx.fillRect(0, y, this.width, CONSTANTS.GROUND_Y);
        this.ctx.fillStyle = '#00b894';
        this.ctx.fillRect(0, y, this.width, 20);
        // Stripes
        this.ctx.fillStyle = 'rgba(255,255,255,0.1)';
        const off = (frame * speed) % 100;
        for(let i=-100; i<this.width+100; i+=100) {
            this.ctx.beginPath();
            this.ctx.moveTo(i-off, y);
            this.ctx.lineTo(i-off+40, this.height);
            this.ctx.lineTo(i-off+80, this.height);
            this.ctx.lineTo(i-off+40, y);
            this.ctx.fill();
        }
    },
    husky(x, y, frame, p) {
        const ctx = this.ctx;
        ctx.save();
        ctx.translate(x, y);
        if(p.isMega) { ctx.scale(1.5, 1.5); ctx.filter = `hue-rotate(${frame*10}deg)`; }
        
        // Body
        ctx.translate(0, Math.sin(frame*0.2)*2); // Bob
        ctx.fillStyle = '#2d3436';
        ctx.beginPath(); ctx.ellipse(0, 20, 20, 12, 0, 0, Math.PI*2); ctx.fill(); // Torso
        ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill(); // Head
        
        // Face
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(0, 5, 16, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2d3436'; 
        ctx.beginPath(); ctx.moveTo(-15,-10); ctx.lineTo(-20,-35); ctx.lineTo(0,-15); ctx.fill(); // L Ear
        ctx.beginPath(); ctx.moveTo(15,-10); ctx.lineTo(20,-35); ctx.lineTo(0,-15); ctx.fill(); // R Ear

        // Eyes
        ctx.fillStyle = '#00fbff';
        ctx.beginPath(); ctx.arc(-8, -2, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -2, 4, 0, Math.PI*2); ctx.fill();

        this.hat(p.hat);

        if(p.shield) {
            ctx.strokeStyle = '#00fbff'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0, 10, 40, 0, Math.PI*2); ctx.stroke();
        }

        ctx.restore();
    },
    hat(type) {
        const ctx = this.ctx;
        if(type === 'cap') {
            ctx.fillStyle = '#d63031';
            ctx.beginPath(); ctx.arc(0, -18, 14, Math.PI, 0); ctx.fill();
            ctx.fillRect(10, -18, 15, 4);
        } else if (type === 'tophat') {
            ctx.fillStyle = '#111';
            ctx.fillRect(-12, -50, 24, 30); ctx.fillRect(-18, -20, 36, 5);
        } else if (type === 'space') {
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.fillStyle='rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.arc(0, -5, 35, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        } else if (type === 'cowboy') {
            ctx.fillStyle = '#8B4513';
            ctx.beginPath(); ctx.ellipse(0, -20, 30, 5, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -25, 15, Math.PI, 0); ctx.fill();
        }
    },
    obj(o) {
        const ctx = this.ctx;
        ctx.save();
        ctx.translate(o.x, o.y);
        if(o.type === 'poo') {
            ctx.fillStyle = '#8B4513';
            ctx.beginPath(); ctx.ellipse(0, 0, 15, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(0, -10, 10, 8, 0, 0, Math.PI*2); ctx.fill();
        } else if (o.type === 'hydrant') {
            ctx.fillStyle = '#d63031'; ctx.fillRect(-10, -30, 20, 30);
            ctx.beginPath(); ctx.arc(0, -30, 10, Math.PI, 0); ctx.fill();
        } else if (o.type === 'cat') {
            ctx.fillStyle = '#b2bec3';
            ctx.beginPath(); ctx.arc(0, -10, 15, Math.PI, 0); ctx.fill();
            ctx.beginPath(); ctx.arc(-12, -15, 8, 0, Math.PI*2); ctx.fill();
        } else if (o.type === 'vacuum') {
            ctx.fillStyle = '#636e72'; ctx.fillRect(-15, -10, 30, 10);
            ctx.fillStyle = '#d63031'; ctx.fillRect(-10, -50, 20, 40);
        } else if (o.type === 'squirrel') {
            ctx.fillStyle = '#e67e22'; ctx.translate(0, Math.sin(Date.now()/100)*-5);
            ctx.beginPath(); ctx.ellipse(0, -5, 12, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -15, 8, 0, Math.PI, false); ctx.fill();
        } else if (o.type === 'bone' || o.type === 'gold') {
            ctx.fillStyle = o.type==='gold'?'#f1c40f':'white';
            ctx.translate(0, Math.sin(Date.now()/200)*5);
            ctx.fillRect(-8,-3,16,6);
            ctx.beginPath(); ctx.arc(-8,0,5,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8,0,5,0,Math.PI*2); ctx.fill();
        } else if (o.type === 'magnet') {
            ctx.fillStyle = '#ff7675';
            ctx.beginPath(); ctx.arc(0,0,12,Math.PI,0); ctx.fill();
        } else if (o.type === 'stick') {
            ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(-10,5); ctx.lineTo(10,-5); ctx.stroke();
            ctx.fillStyle = '#00b894'; ctx.beginPath(); ctx.arc(10,-5,3,0,Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }
};

// --- GAME LOGIC ---
const Game = {
    loopId: null,
    active: false,
    frame: 0,
    
    // Settings
    difficulty: 'normal',
    
    // Stats
    level: 1,
    score: 0,
    bones: 0,
    distance: 0,

    // Entities
    player: { y: 0, dy: 0, grounded: true, shield: false, isMega: false, hat: 'none' },
    obstacles: [],
    
    // Shop
    inventory: ['none'],
    equipped: 'none',

    init() {
        Draw.init(document.getElementById('gameCanvas'));
        
        // Input
        const jump = (e) => {
            if(e.target.tagName !== 'BUTTON' && this.active) {
                e.preventDefault();
                this.playerJump();
            }
        };
        window.addEventListener('mousedown', jump);
        window.addEventListener('touchstart', jump, {passive:false});
    },

    setDiff(mode, el) {
        this.difficulty = mode;
        document.querySelectorAll('.diff-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
    },

    start() {
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('hud').style.display = 'block';
        this.level = 1;
        this.score = 0;
        this.resetLevel();
        this.active = true;
        this.loop();
    },

    nextLevel() {
        document.getElementById('shop-screen').classList.remove('active');
        document.getElementById('hud').style.display = 'block';
        this.level++;
        this.resetLevel();
        this.active = true;
        this.loop();
    },

    restart() {
        document.getElementById('game-over').classList.remove('active');
        if(this.difficulty !== 'baby') {
            this.score = 0;
            this.level = 1;
        }
        this.resetLevel();
        this.active = true;
        this.loop();
    },

    home() {
        document.getElementById('game-over').classList.remove('active');
        document.getElementById('start-screen').classList.add('active');
        document.getElementById('hud').style.display = 'none';
        this.active = false;
        if(this.loopId) cancelAnimationFrame(this.loopId);
    },

    resetLevel() {
        this.frame = 0;
        this.distance = 0;
        this.spawnTimer = 0;
        this.obstacles = [];
        
        // Player Reset
        const p = this.player;
        p.y = 0; p.dy = 0; p.grounded = true; p.canDouble = false;
        p.hat = this.equipped;
        p.shield = (p.hat === 'tophat' || p.hat === 'space');
        p.isMega = false;
        p.megaTimer = 0;
        p.streak = 0;
        p.magnetTimer = 0;
        p.sticks = 0;

        // Hat Physics
        p.gravity = (p.hat === 'space') ? 0.25 : CONSTANTS.GRAVITY;
        p.jumpForce = (p.hat === 'space') ? -8 : CONSTANTS.JUMP_FORCE;

        this.updateHUD();
    },

    updateHUD() {
        document.getElementById('scoreVal').innerText = this.score;
        document.getElementById('shieldVal').innerText = this.player.sticks + "/5";
        document.getElementById('mega-fill').style.width = "0%";
        document.getElementById('mega-meter').classList.remove('active');
    },

    playerJump() {
        const p = this.player;
        if(p.grounded) {
            p.dy = p.jumpForce;
            p.grounded = false;
            p.canDouble = true;
            AudioSys.sfx('jump');
        } else if (p.canDouble) {
            p.dy = p.jumpForce * 0.8;
            p.canDouble = false;
            AudioSys.sfx('double');
        }
    },

    // --- GAME LOOP ---
    loop() {
        if(!this.active) return;
        this.loopId = requestAnimationFrame(() => this.loop());
        
        this.frame++;
        Draw.clear();
        
        // Game Speed
        const speed = CONSTANTS.BASE_SPEED + (this.level * 0.5) + (this.player.isMega ? 4 : 0);
        Draw.ground(speed, this.frame);

        // Player Physics
        const p = this.player;
        
        if(p.megaTimer > 0) {
            p.megaTimer--;
            document.getElementById('mega-fill').style.width = (p.megaTimer/600 * 100) + "%";
            if(p.megaTimer<=0) { p.isMega=false; p.streak=0; document.getElementById('mega-meter').classList.remove('active'); }
        }
        if(p.magnetTimer > 0) p.magnetTimer--;

        p.dy += p.gravity;
        p.y += p.dy;
        
        // Floor Collision
        if(p.y >= 0) {
            p.y = 0; p.dy = 0; p.grounded = true; p.canDouble = false;
        }

        // Draw Player
        const groundY = Draw.height - CONSTANTS.GROUND_Y;
        Draw.husky(100, groundY + p.y, this.frame, p);

        // Spawn Logic
        this.spawnTimer--;
        if(this.spawnTimer <= 0) {
            this.spawnTimer = Math.max(30, 90 - (this.level * 5));
            this.spawnObject();
        }

        // Update Entities
        for(let i = this.obstacles.length - 1; i >= 0; i--) {
            let o = this.obstacles[i];
            
            // Movement speed based on type
            let moveSpeed = speed;
            if(o.type === 'vacuum') moveSpeed *= 1.3;
            if(o.type === 'squirrel') moveSpeed *= 1.5;
            if(o.type === 'cat') moveSpeed = speed; // Cat sits

            o.x -= moveSpeed;
            
            // Magnet
            if(p.magnetTimer > 0 && ['bone','gold'].includes(o.type)) {
                if(Math.abs(100 - o.x) < 300) {
                    o.x += (100 - o.x) * 0.15;
                    o.y += (p.y - o.y) * 0.15;
                }
            }

            // Draw
            Draw.obj({ x: o.x, y: groundY + o.y, type: o.type });

            // Collision
            const dx = Math.abs(100 - o.x);
            const dy = Math.abs((p.y - 15) - o.y);
            const hitDist = 30;

            if(dx < hitDist && dy < hitDist) {
                // Pickup
                if(['bone','gold','magnet','stick'].includes(o.type)) {
                    this.collect(o.type);
                    this.obstacles.splice(i, 1);
                } 
                // Hazard
                else {
                    if(p.isMega) {
                        AudioSys.sfx('hit');
                        this.obstacles.splice(i, 1);
                    } else if (p.shield) {
                        p.shield = false;
                        p.sticks = 0;
                        AudioSys.sfx('hit');
                        this.flash('#ff7675');
                        this.updateHUD();
                        this.obstacles.splice(i, 1);
                    } else {
                        this.gameOver(o.type);
                    }
                }
            }
            
            if(o.x < -100) this.obstacles.splice(i, 1);
        }

        // Level End
        const maxDist = 2000 + (this.level * 500);
        this.distance += speed * 0.1;
        document.getElementById('progress-fill').style.width = (this.distance/maxDist * 100) + "%";

        if(this.distance >= maxDist) {
            this.active = false;
            this.openShop();
        }
    },

    spawnObject() {
        const r = Math.random();
        let type = 'poo';
        let y = 0;

        if(this.level >= 3 && r > 0.9) { type = 'vacuum'; }
        else if(this.level >= 2 && r > 0.82) { type = 'squirrel'; }
        else if(this.level >= 2 && r > 0.75) { type = 'cat'; }
        else if(r > 0.6) { type = 'hydrant'; }
        else if(r > 0.5) { type = 'bird'; y = -90; }
        else if(r > 0.3) { type = 'bone'; y = Math.random()>0.5 ? -100 : -30; }
        else if(r > 0.25) { type = 'gold'; y = -30; }
        else if(r > 0.22) { type = 'stick'; y = -30; }
        else if(r > 0.20) { type = 'magnet'; y = -50; }

        this.obstacles.push({ x: Draw.width + 50, y, type });
    },

    collect(type) {
        if(type === 'stick') {
            if(this.difficulty === 'death') return;
            this.player.sticks++;
            if(this.player.sticks >= 5) {
                this.player.sticks = 0;
                this.player.shield = true;
                this.flash('#00fbff');
                AudioSys.sfx('power');
            }
        } else if (type === 'magnet') {
            this.player.magnetTimer = 600;
            AudioSys.sfx('power');
        } else {
            // Bones
            const mult = (this.player.hat === 'cap') ? 2 : 1;
            const pts = (type === 'gold' ? 5 : 1) * mult;
            this.score += pts;
            this.bones += pts;
            AudioSys.sfx('coin');
            
            // Mega
            const target = (this.player.hat === 'cowboy') ? 25 : 50;
            this.player.streak += (type==='gold'?5:1);
            if(!this.player.isMega) {
                document.getElementById('mega-fill').style.width = (this.player.streak/target * 100) + "%";
                if(this.player.streak >= target) {
                    this.player.isMega = true;
                    this.player.megaTimer = 600;
                    document.getElementById('mega-meter').classList.add('active');
                    AudioSys.sfx('power');
                }
            }
        }
        this.updateHUD();
    },

    gameOver(reason) {
        this.active = false;
        AudioSys.sfx('hit');
        document.getElementById('death-msg').innerText = "Hit by " + reason.toUpperCase();
        document.getElementById('final-score').innerText = this.score;
        document.getElementById('hud').style.display = 'none';
        document.getElementById('game-over').classList.add('active');
    },

    // --- SHOP LOGIC ---
    openShop() {
        document.getElementById('hud').style.display = 'none';
        document.getElementById('shop-screen').classList.add('active');
        this.renderShop();
    },

    renderShop() {
        const grid = document.getElementById('shop-grid');
        document.getElementById('shop-bank').innerText = this.bones;
        grid.innerHTML = '';

        Object.values(HATS).forEach(hat => {
            const owned = this.inventory.includes(hat.id);
            const equipped = this.equipped === hat.id;
            const afford = this.bones >= hat.cost;

            const el = document.createElement('div');
            el.className = `shop-item ${owned?'owned':''} ${equipped?'equipped':''} ${(!owned && !afford)?'locked':''}`;
            el.innerHTML = `
                <div style="font-weight:900">${hat.name}</div>
                <div style="font-size:10px; margin:5px 0;">${hat.perk}</div>
                <div style="font-weight:bold; color:${owned?'#00b894':'#d63031'}">${owned ? (equipped?'EQUIPPED':'OWNED') : hat.cost+' 🦴'}</div>
            `;
            el.onclick = () => {
                if(equipped) return;
                if(owned) {
                    this.equipped = hat.id;
                    AudioSys.sfx('coin');
                } else if(afford) {
                    this.bones -= hat.cost;
                    this.inventory.push(hat.id);
                    this.equipped = hat.id;
                    AudioSys.sfx('power');
                } else {
                    AudioSys.sfx('hit');
                }
                this.renderShop();
            };
            grid.appendChild(el);
        });
    },

    flash(color) {
        const f = document.getElementById('flash');
        f.style.background = color;
        f.style.opacity = 0.5;
        setTimeout(() => f.style.opacity = 0, 100);
    }
};

// Start
Game.init();

</script>
</body>
</html>
