<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepper's Doo-Doo Dash V3</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            margin: 0; overflow: hidden; background: #1a1a1a; 
            font-family: 'Montserrat', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none; 
        }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        
        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 100;
            transition: opacity 0.1s ease-out;
        }

        .hud-top { 
            display: flex; justify-content: space-between; width: 90%; margin-top: 15px; 
            align-items: flex-start;
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px; padding: 8px 16px; color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        #score { font-size: 20px; font-weight: 900; line-height: 1; }
        
        /* Adjusted layout to prevent overlapping */
        #high-score-box { 
            margin-top: 5px; font-size: 10px; color: rgba(255,255,255,0.7); font-weight: 700; letter-spacing: 1px; 
            text-align: center;
        }
        
        #level-indicator { color: #00fbff; font-weight: 900; font-size: 12px; margin-bottom: 2px; }

        #mute-btn {
            width: 35px; height: 35px;
            background: rgba(0,0,0,0.5); border-radius: 50%; border: 2px solid white;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            pointer-events: auto; font-size: 18px; color: white; margin-left: 10px;
        }

        /* Moved Progress Bar Down */
        #progress-wrapper {
            position: absolute; top: 100px; width: 70%; height: 8px;
            background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
        }
        #progress-fill {
            height: 100%; width: 0%; background: #00fbff;
            box-shadow: 0 0 10px #00fbff; transition: width 0.1s linear;
        }
        #finish-icon { position: absolute; right: -10px; top: -8px; font-size: 20px; }

        /* Ability Notifications */
        #ability-msg {
            position: absolute; top: 130px; width: 100%; text-align: center;
            font-weight: 900; font-size: 14px; color: #ffeaa7; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            opacity: 0; transition: opacity 0.5s;
        }

        #power-wrapper { position: absolute; bottom: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #streak-label { color: white; font-size: 12px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #streak-container { width: 80%; max-width: 300px; height: 12px; background: rgba(0,0,0,0.6); border-radius: 6px; overflow: hidden; position: relative; }
        #streak-fill { position: absolute; top: 0; left: 0; height: 100%; background: #ff00ff; width: 0%; transition: width 0.2s cubic-bezier(0.4, 2, 0.5, 1); box-shadow: 0 0 10px #ff00ff; }
        #mega-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; display: block; background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff); background-size: 200%; animation: rainbow 0.5s linear infinite; transition: none; }
        @keyframes rainbow { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

        #start-screen, #game-over, #level-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 50; text-align: center; /* Z-index increased to fix button click issues */
        }
        #game-over, #level-screen { background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); display: none; }

        .title-box { margin-bottom: 40px; animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 2; }
        h1 { 
            color: #fff; font-size: 50px; margin: 0; line-height: 0.9; font-weight: 900; 
            letter-spacing: -3px; text-transform: uppercase;
            background: -webkit-linear-gradient(#fff, #b2bec3);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5));
        }

        .btn { 
            background: white; color: #2d3436; padding: 20px 60px; border-radius: 16px; 
            font-size: 22px; font-weight: 900; margin-top: 20px; z-index: 100; /* High z-index for clickable */
            letter-spacing: 2px; text-transform: uppercase; pointer-events: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            transition: all 0.2s; cursor: pointer; animation: breathe 3s infinite ease-in-out;
        }
        .btn:active { transform: scale(0.95); background: #dfe6e9; animation: none; }
        
        @keyframes slideUp { 0% { transform: translateY(50px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* HUSKY CSS */
        .husky-container { position: relative; width: 160px; height: 160px; margin-bottom: 20px; animation: float 4s ease-in-out infinite; z-index: 2; }
        .husky-head { width: 100%; height: 100%; background: #dfe6e9; border-radius: 40%; position: relative; border: 4px solid white; box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden; }
        .h-ear-l, .h-ear-r { position: absolute; top: -20px; width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 60px solid #b2bec3; z-index: -1; }
        .h-ear-l { left: 10px; transform: rotate(-25deg); } .h-ear-r { right: 10px; transform: rotate(25deg); }
        .h-ear-inner { position: absolute; top: 15px; left: -10px; width: 20px; height: 30px; background: #ffeaa7; border-radius: 50%; opacity: 0.5; }
        .h-mask-top { position: absolute; top: 0; left: 0; width: 100%; height: 45px; background: #b2bec3; border-radius: 0 0 50% 50%; z-index: 2; }
        .cheek-l { position: absolute; bottom: 20px; left: -10px; width: 35px; height: 35px; background: white; border-radius: 50%; z-index: 4; }
        .cheek-r { position: absolute; bottom: 20px; right: -10px; width: 35px; height: 35px; background: white; border-radius: 50%; z-index: 4; }
        .h-eye-l, .h-eye-r { position: absolute; top: 55px; width: 22px; height: 22px; background: #00fbff; border-radius: 50%; animation: blink 4s infinite; border: 3px solid #2d3436; z-index: 3; }
        .h-eye-l { left: 30px; } .h-eye-r { right: 30px; }
        .h-snout { position: absolute; bottom: 25px; left: 45px; width: 60px; height: 45px; background: white; border-radius: 30px; z-index: 3; border: 2px solid #eee; }
        .h-nose { position: absolute; bottom: 50px; left: 65px; width: 20px; height: 14px; background: #2d3436; border-radius: 50%; z-index: 4; }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="flash-overlay"></div>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="glass-pill" id="score-box">
                <div id="level-indicator">LEVEL 1</div>
                <span id="score">0 PTS</span>
                <div id="high-score-box">BEST: 0</div>
            </div>
            
            <div style="display:flex; gap:10px;">
                <div class="glass-pill" id="bone-box">
                    <span style="color:#FFD700; font-weight:900;">🦴</span>
                    <span id="bone-text">0/3</span>
                </div>
                <div id="mute-btn">🔊</div>
            </div>
        </div>

        <div id="progress-wrapper">
            <div id="progress-fill"></div>
            <div id="finish-icon">🏁</div>
        </div>
        
        <div id="ability-msg"></div>

        <div id="power-wrapper">
            <div id="streak-label">MEGA METER (50 TO UNLOCK)</div>
            <div id="streak-container">
                <div id="streak-fill"></div>
                <div id="mega-fill"></div>
            </div>
        </div>
    </div>

    <div id="start-screen">
        <div class="husky-container">
            <div class="h-ear-l"><div class="h-ear-inner"></div></div>
            <div class="h-ear-r"><div class="h-ear-inner"></div></div>
            <div class="husky-head">
                <div class="h-mask-top"></div>
                <div class="h-eye-l"></div><div class="h-eye-r"></div>
                <div class="cheek-l"></div><div class="cheek-r"></div>
                <div class="h-snout"></div><div class="h-nose"></div>
            </div>
        </div>
        <div class="title-box">
            <h1>PEPPER'S<br>DOO-DOO DASH</h1>
        </div>
        <div class="btn" onclick="handleInput()">TAP TO START</div>
    </div>

    <div id="level-screen">
        <h1 style="color:#00fbff; font-size:40px;">LEVEL COMPLETE!</h1>
        <div class="glass-pill" style="margin: 20px 0;">
            <span id="score-label">NEXT CHALLENGE AWAITS</span>
        </div>
        <div class="btn" id="next-level-btn">NEXT LEVEL >></div>
    </div>

    <div id="game-over">
        <h1 style="color:#ff7675; font-size:50px;">GAME OVER!</h1>
        <div class="glass-pill" style="margin: 20px 0;">
            <span id="score-label">FINAL SCORE</span>
            <span id="end-score" style="font-size: 40px; font-weight: 900;">0</span>
        </div>
        <div id="new-record-msg" style="color:#ffeaa7; font-weight:900; display:none; margin-top:10px; animation: breathe 0.5s infinite;">🏆 NEW RECORD! 🏆</div>
        <div class="btn" onclick="resetGame()">TRY AGAIN</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const levelInd = document.getElementById('level-indicator');
    const boneText = document.getElementById('bone-text');
    const streakFill = document.getElementById('streak-fill');
    const megaFill = document.getElementById('mega-fill');
    const streakLabel = document.getElementById('streak-label');
    const progressFill = document.getElementById('progress-fill');
    const highScoreEl = document.getElementById('high-score-box');
    const muteBtn = document.getElementById('mute-btn');
    const newRecordMsg = document.getElementById('new-record-msg');
    const abilityMsg = document.getElementById('ability-msg');
    
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over');
    const levelScreen = document.getElementById('level-screen');
    const nextLevelBtn = document.getElementById('next-level-btn');
    const endScoreEl = document.getElementById('end-score');
    const flashOverlay = document.getElementById('flash-overlay');
    
    function resize() { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
        groundY = canvas.height - GROUND_H;
        if(!gameActive && !frame) pepper.y = groundY;
    }
    window.addEventListener('resize', resize);

    // --- PHYSICS & CONSTANTS ---
    const GRAVITY = 1.1; 
    const JUMP_FORCE = -19; 
    const DOUBLE_JUMP_FORCE = -15; 
    const GROUND_H = 140; 
    const MEGA_MAX_TIME = 600;
    const MEGA_TRIGGER = 50; // UPDATED: Harder to get
    const DOUBLE_JUMP_UNLOCK = 10; // UPDATED: Requires 10 jumps
    
    // Game State
    let gameActive = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('pepperHighScore') || 0;
    let speed = 9;
    let groundY = 0; 
    let shakeAmount = 0;
    let zoomLevel = 1;
    let currentLevel = 1;
    let levelDistance = 0;
    let levelMaxDistance = 2000; 
    let levelFinished = false; 
    let isMuted = false;

    // Environmental Colors
    let envStyles = [
        { c1: "#81ecec", c2: "#74b9ff", grass: "#00b894", track: "#2d3436" }, 
        { c1: "#ff9f43", c2: "#ee5253", grass: "#e17055", track: "#2d3436" }, 
        { c1: "#2c3e50", c2: "#000000", grass: "#192a56", track: "#576574" }  
    ];
    let curStyle = envStyles[0];

    let pepper = {
        x: 100, y: 0, dy: 0,
        grounded: true, canDoubleJump: false, isMega: false,
        streak: 0, megaTimer: 0, bones: 0, hasShield: false, size: 1,
        totalJumps: 0, doubleJumpUnlocked: false
    };

    let obstacles = [];
    let bones = [];
    let speedLines = [];
    let particles = [];
    let bgObjects = []; 
    let midObjects = []; 
    let floatTexts = [];
    let nextObstacleTimer = 0;
    let finishLine = null; 

    // --- AUDIO ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let musicInterval;
    let step = 0;
    const bassSeq = [98.00, null, 98.00, 116.54, null, 130.81, null, 146.83, null, 130.81, 116.54, null, 98.00, null, 146.83, null];
    const chordSeq = [null, null, null, null, [261,311,392], null, null, null, null, null, null, null, [233,277,349], null, null, null];

    function initAudio() {
        if (!audioCtx && AudioContext) audioCtx = new AudioContext();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    muteBtn.onclick = (e) => {
        e.stopPropagation();
        isMuted = !isMuted;
        muteBtn.innerText = isMuted ? "🔇" : "🔊";
        if(isMuted) stopMusic();
        else if(gameActive) startMusic();
    };

    function synth(freq, type, vol, decay, wah=false) {
        if (!audioCtx || isMuted) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (wah) {
            filter.type = 'lowpass'; filter.Q.value = 5;
            filter.frequency.setValueAtTime(200, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + decay);
        } else { filter.type = 'allpass'; }
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.01); 
        gain.gain.exponentialRampToValueAtTime(0.001, now + decay);
        osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + decay + 0.1);
    }
    function playChord(freqs) { freqs.forEach(f => synth(f, 'triangle', 0.05, 0.2)); }
    function playSnare() {
        if (!audioCtx || isMuted) return;
        const b = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
        const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const n = audioCtx.createBufferSource(); n.buffer = b;
        const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1000;
        const g = audioCtx.createGain(); g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        n.connect(f); f.connect(g); g.connect(audioCtx.destination); n.start();
    }
    function startMusic() {
        if (musicInterval || isMuted) return;
        step = 0;
        musicInterval = setInterval(() => {
            if (!gameActive) return;
            if (pepper.isMega) {
                let arp = [523, 659, 783, 1046]; synth(arp[step % 4], 'square', 0.08, 0.1);
                if(step % 2 === 0) synth(130, 'sawtooth', 0.15, 0.1); if(step % 4 === 2) playSnare();
            } else {
                let b = bassSeq[step % 16]; if (b) synth(b, 'sawtooth', 0.2, 0.2, true); 
                let c = chordSeq[step % 16]; if (c) playChord(c);
                if ((step % 16) === 4 || (step % 16) === 12) playSnare();
                if (step % 2 !== 0) synth(8000, 'square', 0.02, 0.03); 
            }
            step++;
        }, 130);
    }
    function stopMusic() { clearInterval(musicInterval); musicInterval = null; }
    function playSfx(type) {
        if (!audioCtx || isMuted) return;
        if(type==='jump') synth(350, 'triangle', 0.1, 0.1);
        if(type==='doublejump') synth(600, 'square', 0.1, 0.1);
        if(type==='collect') synth(1400, 'sine', 0.1, 0.2);
        if(type==='smash') { synth(80, 'sawtooth', 0.3, 0.3); playSnare(); }
        if(type==='crash') synth(50, 'sawtooth', 0.4, 0.5);
        if(type==='levelup') { synth(440, 'triangle', 0.2, 0.5); setTimeout(()=>synth(880, 'triangle', 0.2, 0.5), 100); }
        if(type==='splash') { 
            // Water sound
            const osc = audioCtx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime+0.3);
            const g = audioCtx.createGain(); g.gain.setValueAtTime(0.3, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.3);
            osc.connect(g); g.connect(audioCtx.destination); osc.start(); 
        }
    }

    // --- GAME UTILS ---
    function spawnPopup(text, x, y, color) { floatTexts.push({ text, x, y, color, life: 1.0 }); }
    function spawnParticles(x, y, color, count) { for(let i=0;i<count;i++) particles.push({x, y, vx:(Math.random()-0.5)*15, vy:(Math.random()-1)*15, life:1, color}); }
    function shakeScreen(amount) { shakeAmount = amount; }
    function flashScreen(color='white') {
        flashOverlay.style.background = color; flashOverlay.style.opacity = 0.5; setTimeout(() => flashOverlay.style.opacity = 0, 100);
    }
    function updateEnvStyle() { let index = (currentLevel - 1) % envStyles.length; curStyle = envStyles[index]; }

    // --- DRAWING ---
    function drawEnv() {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, curStyle.c1); grad.addColorStop(1, curStyle.c2);
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "rgba(255,255,255,0.2)";
        let celestialY = (currentLevel%3===2) ? canvas.height*0.8 : 100;
        ctx.beginPath(); ctx.arc(canvas.width*0.8, celestialY, 60, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.1)";
        bgObjects.forEach(o => {
            if(!levelFinished) o.x -= speed * 0.1; if(o.x < -200) o.x = canvas.width + 100;
            ctx.beginPath(); ctx.moveTo(o.x, groundY); ctx.lineTo(o.x+150, groundY-250); ctx.lineTo(o.x+300, groundY); ctx.fill();
        });
        midObjects.forEach(o => {
            if(!levelFinished) o.x -= speed * 0.3; if(o.x < -50) o.x = canvas.width + Math.random()*300;
            ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.beginPath(); ctx.moveTo(o.x, groundY); ctx.lineTo(o.x+25, groundY-100); ctx.lineTo(o.x+50, groundY); ctx.fill();
        });

        ctx.fillStyle = curStyle.track; ctx.fillRect(0, groundY, canvas.width, GROUND_H);
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        let stripeOffset = (frame * speed) % 100;
        for(let i = -100; i < canvas.width + 100; i+=100) {
            ctx.beginPath(); ctx.moveTo(i - stripeOffset, groundY); ctx.lineTo(i - stripeOffset + 40, groundY + GROUND_H);
            ctx.lineTo(i - stripeOffset + 90, groundY + GROUND_H); ctx.lineTo(i - stripeOffset + 50, groundY); ctx.fill();
        }
        ctx.fillStyle = curStyle.grass; ctx.fillRect(0, groundY, canvas.width, 15);
    }

    function drawHusky(x, y) {
        ctx.save(); ctx.translate(x, y);
        let targetSize = pepper.isMega ? 1.4 : 1;
        pepper.size += (targetSize - pepper.size) * 0.1;
        ctx.scale(pepper.size, pepper.size);
        
        if (!pepper.grounded && !pepper.canDoubleJump) ctx.rotate(frame * 0.3);
        else if(!pepper.grounded) ctx.rotate(pepper.dy * 0.04);

        if(pepper.hasShield) { 
            ctx.shadowBlur = 20; ctx.shadowColor = "#00fbff"; ctx.strokeStyle = "#00fbff"; ctx.lineWidth=3; 
            ctx.beginPath(); ctx.arc(0,-25,55,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur = 0;
        }

        // RAINBOW EFFECT FOR MEGA MODE
        let bodyColor = "#2d3436";
        let whiteColor = "white";
        if(pepper.isMega) {
            let hue = (frame * 10) % 360;
            bodyColor = `hsl(${hue}, 80%, 50%)`;
            whiteColor = `hsl(${(hue+180)%360}, 80%, 80%)`;
        }

        ctx.save(); ctx.translate(-30, -25); ctx.rotate(-0.5+Math.sin(frame*0.3)*0.4);
        ctx.fillStyle=bodyColor; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-20,-10,-10,-30); ctx.quadraticCurveTo(5,-40,15,-25); ctx.lineTo(5,-5); ctx.fill();
        ctx.fillStyle=whiteColor; ctx.beginPath(); ctx.moveTo(-5,-25); ctx.quadraticCurveTo(5,-35,12,-25); ctx.lineTo(5,-15); ctx.fill();
        ctx.restore();

        ctx.fillStyle=bodyColor; ctx.beginPath(); ctx.ellipse(0,-20,40,24,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=whiteColor; ctx.beginPath(); ctx.ellipse(15,-18,25,16,0,0,Math.PI*2); ctx.fill();

        ctx.save(); ctx.translate(30,-35);
        let earBounce = Math.sin(frame*0.5)*2;
        ctx.fillStyle=bodyColor; 
        ctx.beginPath(); ctx.moveTo(-8,-10+earBounce); ctx.lineTo(-15,-35+earBounce); ctx.lineTo(0,-15+earBounce); ctx.fill(); 
        ctx.beginPath(); ctx.moveTo(8,-10+earBounce); ctx.lineTo(15,-35+earBounce); ctx.lineTo(0,-15+earBounce); ctx.fill();  
        ctx.beginPath(); ctx.arc(0,0,23,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, -5, 18, Math.PI, 0); ctx.fill(); 
        ctx.fillStyle=whiteColor; ctx.beginPath(); ctx.ellipse(0, 5, 20, 15, 0, 0, Math.PI*2); ctx.fill(); 
        ctx.fillStyle="#00fbff"; ctx.beginPath(); ctx.arc(-10,-1,5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(10,-1,5,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="white"; ctx.beginPath(); ctx.arc(-8,-3,2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(12,-3,2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="white"; ctx.beginPath(); ctx.ellipse(0,12,12,9,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="black"; ctx.beginPath(); ctx.ellipse(0,9,5,3,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#ff7675"; ctx.beginPath(); ctx.arc(0, 15, 4, 0, Math.PI, false); ctx.fill();
        ctx.restore();

        ctx.strokeStyle=whiteColor; ctx.lineWidth=7; ctx.lineCap="round";
        let leg=pepper.grounded?Math.sin(frame*0.4)*8:-5;
        ctx.beginPath(); ctx.moveTo(-15,-5); ctx.lineTo(-15+leg,5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(15,-5); ctx.lineTo(15-leg,5); ctx.stroke();
        ctx.restore();
    }

    function drawPoo(x, y, stack) {
        ctx.save(); ctx.translate(x, y);
        for(let i=0; i<stack; i++) {
            let yOff = -i * 35;
            ctx.fillStyle = "#8B4513";
            ctx.beginPath(); ctx.ellipse(0, yOff-5, 22, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(0, yOff-15, 18, 9, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(0, yOff-25, 12, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-5,yOff-25); ctx.quadraticCurveTo(0,yOff-38, 5,yOff-25); ctx.fill();
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(-7,yOff-15,5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(7,yOff-15,5,0,Math.PI*2); ctx.fill();
            ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(-7,yOff-15,2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(7,yOff-15,2,0,Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }

    function drawBird(x, y) {
        ctx.save(); ctx.translate(x, y+Math.sin(frame*0.2)*10);
        ctx.fillStyle = "#636e72"; ctx.beginPath(); ctx.ellipse(0,0,20,10,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = "white"; ctx.beginPath(); ctx.moveTo(-5,0); ctx.lineTo(-25,-15); ctx.lineTo(-10,5); ctx.fill();
        ctx.fillStyle = "#fab1a0"; ctx.beginPath(); ctx.moveTo(15, -2); ctx.lineTo(25, 2); ctx.lineTo(15, 6); ctx.fill();
        ctx.restore();
    }

    function drawHydrant(x, y) {
        ctx.save(); ctx.translate(x, y);
        ctx.fillStyle = "#d63031"; // Red
        ctx.fillRect(-15, -40, 30, 40); // Body
        ctx.fillRect(-20, -10, 40, 10); // Base ring
        ctx.fillRect(-20, -35, 10, 10); // Nozzle Left
        ctx.fillRect(10, -35, 10, 10); // Nozzle Right
        ctx.beginPath(); ctx.arc(0, -40, 15, Math.PI, 0); ctx.fill(); // Top dome
        ctx.fillStyle = "#b2bec3"; ctx.fillRect(-5, -45, 10, 5); // Bolt top
        ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(-15, -25, 30, 5); // Shadow line
        ctx.restore();
    }

    function drawSpeedLines() {
        if(!pepper.isMega) return;
        ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
        if(Math.random()>0.5) speedLines.push({x:canvas.width, y:Math.random()*canvas.height, w:Math.random()*200+50});
        for(let i=speedLines.length-1; i>=0; i--) {
            let s = speedLines[i]; s.x -= 40; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x+s.w, s.y); ctx.stroke();
            if(s.x < -s.w) speedLines.splice(i,1);
        }
    }

    // --- MAIN LOOP ---
    function loop() {
        if (!gameActive) { drawEnv(); drawHusky(150, groundY); return; }
        
        if (!levelFinished) {
            frame++; levelDistance += speed * 0.1;
            let pct = Math.min((levelDistance / levelMaxDistance) * 100, 100); progressFill.style.width = pct + "%";
            if(levelDistance >= levelMaxDistance && !finishLine) finishLine = {x: canvas.width, type: 'finish'};
        }

        groundY = canvas.height - GROUND_H;
        
        ctx.save();
        let targetZoom = pepper.isMega ? 1.05 : 1.0; zoomLevel += (targetZoom - zoomLevel) * 0.05;
        ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(zoomLevel, zoomLevel); ctx.translate(-canvas.width/2, -canvas.height/2);
        if(shakeAmount > 0) { ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount); shakeAmount*=0.9; }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawEnv(); drawSpeedLines();

        // Particles & Text
        [particles, floatTexts].forEach(arr => {
            for(let i=arr.length-1; i>=0; i--) {
                let p = arr[i]; 
                if(p.text) { p.y-=2; p.life-=0.02; ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.font="900 30px 'Montserrat'"; ctx.fillText(p.text, p.x, p.y); } 
                else { p.x+=p.vx; p.y+=p.vy; p.life-=0.03; ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill(); }
                if(p.life<=0) arr.splice(i,1);
            }
        });
        ctx.globalAlpha=1;

        if(pepper.isMega) {
            pepper.megaTimer--; streakFill.style.width="100%"; megaFill.style.display="block";
            let pct = (pepper.megaTimer / MEGA_MAX_TIME) * 100; if(pct < 0) pct = 0; megaFill.style.width = pct + "%";
            streakLabel.innerText = "MEGA MODE!"; streakLabel.style.color = "#00fbff";
            if(pepper.megaTimer<=0) { pepper.isMega=false; pepper.streak=0; streakFill.style.width="0%"; megaFill.style.display="none"; streakLabel.innerText = "MEGA METER (50 TO UNLOCK)"; streakLabel.style.color = "white"; }
        }

        pepper.dy += GRAVITY; pepper.y += pepper.dy;
        if(pepper.y >= groundY) { pepper.y=groundY; pepper.dy=0; pepper.grounded=true; pepper.canDoubleJump = false; }
        
        drawHusky(150, pepper.y);

        if(finishLine) {
            finishLine.x -= speed;
            ctx.save(); ctx.translate(finishLine.x, groundY - 80);
            ctx.fillStyle = "white"; ctx.fillRect(0, 0, 5, 80); 
            for(let r=0; r<4; r++) { for(let c=0; c<4; c++) { ctx.fillStyle = (r+c)%2===0 ? "white" : "black"; ctx.fillRect(5 + c*10, r*10, 10, 10); } }
            ctx.restore();
            if(finishLine.x < 150) completeLevel();
        }

        if(!finishLine) {
            nextObstacleTimer--;
            if(nextObstacleTimer <= 0) {
                let r = Math.random();
                let type = 'poo';
                let stack = 1; 
                let yPos = groundY;
                
                if(r > 0.90) type = 'hydrant'; // Rare hydrant
                else if (r > 0.75) { type = 'bird'; yPos = groundY - 50 - Math.random()*30; }
                else { type = 'poo'; stack = Math.floor(Math.random()*2)+1; }

                obstacles.push({x: canvas.width, type: type, stack: stack, y: yPos, passed: false});
                nextObstacleTimer = Math.max(30, 80 - score*0.3);
            }
            if(frame % 130 === 0) bones.push({x: canvas.width, y: groundY - 120});
        }

        for(let i=obstacles.length-1; i>=0; i--) {
            let o = obstacles[i]; 
            if(!levelFinished) o.x -= speed;
            
            if(o.type === 'poo') drawPoo(o.x, groundY, o.stack);
            else if(o.type === 'bird') drawBird(o.x, o.y);
            else if(o.type === 'hydrant') drawHydrant(o.x, groundY);
            
            // Collision
            let hit = false;
            if(o.type === 'bird' && Math.abs(150-o.x)<30 && Math.abs(pepper.y-30-o.y)<30) hit=true;
            if(o.type === 'poo' && Math.abs(150-o.x)<25 && pepper.y > groundY-(o.stack*35)+15) hit=true;
            if(o.type === 'hydrant' && Math.abs(150-o.x)<25 && pepper.y > groundY-35) hit=true;

            if(hit) {
                // HYDRANT LOGIC: Always Deadly (even in Mega)
                if(o.type === 'hydrant') {
                    spawnParticles(o.x, groundY, "#00fbff", 40); // Water explosion
                    playSfx('splash'); playSfx('crash');
                    flashScreen('#00fbff');
                    gameOver();
                    continue; 
                }

                if(pepper.isMega) {
                    score += 5; spawnParticles(o.x, groundY, "#8B4513", 20); 
                    spawnPopup("SMASH!", o.x, o.y-50, "orange"); playSfx('smash'); shakeScreen(15);
                    obstacles.splice(i, 1); continue;
                }
                if(pepper.hasShield) {
                    pepper.hasShield = false; boneText.innerText="0/3"; spawnParticles(o.x, groundY, "#00fbff", 25); playSfx('crash'); flashScreen('red');
                    obstacles.splice(i, 1); continue;
                }
                gameOver();
            }

            if(!o.passed && o.x < 150) { 
                o.passed = true; score++; scoreEl.innerText = score + " PTS"; 
                if(!pepper.isMega) {
                    pepper.streak++; 
                    let fillPct = (pepper.streak / MEGA_TRIGGER) * 100;
                    streakFill.style.width = fillPct+"%";
                    if(pepper.streak>=MEGA_TRIGGER){ 
                        pepper.isMega=true; pepper.megaTimer=MEGA_MAX_TIME; 
                        megaFill.style.display="block"; spawnPopup("MEGA MODE!", canvas.width/2, canvas.height/3, "#ff00ff"); flashScreen('white');
                    }
                }
            }
            if(o.x < -100) obstacles.splice(i, 1);
        }

        for(let i=bones.length-1; i>=0; i--) {
            let b = bones[i]; 
            if(!levelFinished) {
                if(pepper.isMega && b.x < canvas.width && b.x > 0) { b.x -= (b.x - 150) * 0.2; b.y -= (b.y - pepper.y) * 0.2; } else { b.x -= speed; }
            }
            ctx.save(); ctx.translate(b.x, b.y+Math.sin(frame*0.1)*5);
            ctx.fillStyle="#FFD700"; ctx.beginPath(); ctx.roundRect(-12,-5,24,10,3); ctx.fill();
            ctx.restore();
            if(Math.abs(150-b.x)<40 && Math.abs(pepper.y-25-b.y)<40) {
                pepper.bones++; playSfx('collect'); spawnParticles(b.x, b.y, "gold", 15);
                if(pepper.bones>=3) { pepper.hasShield=true; pepper.bones=0; spawnPopup("SHIELD UP!", 150, pepper.y-50, "#00fbff"); flashScreen('#00fbff'); }
                boneText.innerText=pepper.bones+"/3"; bones.splice(i,1);
            } else if(b.x<-100) bones.splice(i,1);
        }

        ctx.restore();
        if(gameActive) requestAnimationFrame(loop);
    }

    function completeLevel() {
        levelFinished = true;
        playSfx('levelup');
        levelScreen.style.display = 'flex';
        
        // Fixed button listener - ensure it's not added multiple times
        nextLevelBtn.onclick = function(e) {
            e.stopPropagation(); // prevent game click
            currentLevel++;
            updateEnvStyle();
            levelMaxDistance += 1000;
            speed += 2;
            levelDistance = 0;
            finishLine = null;
            obstacles = [];
            levelFinished = false;
            levelScreen.style.display = 'none';
            levelInd.innerText = "LEVEL " + currentLevel;
            pepper.x = -50; 
            let runIn = setInterval(() => { pepper.x += 5; if(pepper.x >= 100) { clearInterval(runIn); pepper.x = 100; } }, 16);
        };
    }

    function gameOver() {
        gameActive = false; stopMusic();
        if(score > highScore) {
            highScore = score; localStorage.setItem('pepperHighScore', highScore);
            highScoreEl.innerText = "BEST: " + highScore; newRecordMsg.style.display = "block";
        } else { newRecordMsg.style.display = "none"; }
        endScoreEl.innerText = score; 
        gameOverScreen.style.display = 'flex';
    }
    
    function resetGame() {
        gameOverScreen.style.display = 'none';
        handleInput();
    }

    function showAbilityMsg(text) {
        abilityMsg.innerText = text; abilityMsg.style.opacity = 1;
        setTimeout(() => abilityMsg.style.opacity = 0, 2000);
    }

    function handleInput() {
        initAudio();
        if(!gameActive) {
            resize(); 
            score = 0; scoreEl.innerText="0 PTS"; pepper.bones=0; boneText.innerText="0/3"; 
            pepper.streak=0; streakFill.style.width="0%"; obstacles=[]; bones=[]; floatTexts=[]; bgObjects=[]; midObjects=[];
            speed=9; levelDistance=0; levelFinished=false; finishLine=null;
            currentLevel=1; updateEnvStyle(); levelInd.innerText = "LEVEL 1";
            pepper.y = groundY; pepper.dy=0; pepper.grounded=true; 
            pepper.totalJumps = 0; pepper.doubleJumpUnlocked = false;
            
            gameActive = true; startScreen.style.display = 'none'; gameOverScreen.style.display = 'none';
            for(let i=0; i<3; i++) bgObjects.push({x:Math.random()*canvas.width});
            for(let i=0; i<5; i++) midObjects.push({x:Math.random()*canvas.width});
            startMusic(); loop();
        } else {
            if(pepper.grounded) {
                pepper.dy = JUMP_FORCE; pepper.grounded = false; 
                playSfx('jump');
                pepper.totalJumps++;
                
                // UNLOCK DOUBLE JUMP LOGIC
                if(!pepper.doubleJumpUnlocked && pepper.totalJumps >= DOUBLE_JUMP_UNLOCK) {
                    pepper.doubleJumpUnlocked = true;
                    showAbilityMsg("DOUBLE JUMP UNLOCKED! (TAP AIR)");
                    spawnParticles(150, pepper.y, "white", 30);
                    playSfx('levelup');
                }
                
                if(pepper.doubleJumpUnlocked) pepper.canDoubleJump = true;

            } else if (pepper.canDoubleJump) {
                pepper.dy = DOUBLE_JUMP_FORCE; pepper.canDoubleJump = false; playSfx('doublejump'); 
                spawnParticles(150, pepper.y, "white", 5); 
            }
        }
    }

    highScoreEl.innerText = "BEST: " + highScore;
    window.addEventListener('touchstart', (e) => { 
        if(e.target.className.includes('btn')) return; // Allow buttons to work
        if(e.target !== muteBtn) { e.preventDefault(); handleInput(); }
    }, {passive: false});
    
    window.addEventListener('mousedown', (e) => {
        if(e.target.className.includes('btn')) return;
        if(e.target !== muteBtn) handleInput();
    });

    resize();
    ctx.fillStyle = "#1a1a1a"; ctx.fillRect(0,0,canvas.width,canvas.height);
</script>
</body>
